@keyframes screenIn{from{opacity:0;transform:translateY(8px) scale(.99)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:.35;transform:scale(.95)}50%{opacity:.9;transform:scale(1.02)}}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes sheen{0%,60%{transform:translateX(-65%) rotate(8deg)}85%,100%{transform:translateX(60%) rotate(8deg)}}
@keyframes fall{from{transform:translate3d(0,-10vh,0) rotate(0);opacity:1}to{transform:translate3d(var(--x),110vh,0) rotate(680deg);opacity:0}}
@keyframes drift{from{transform:translate3d(-1%,0,0)}to{transform:translate3d(1%,1%,0)}}
@media(max-width:700px){.shell{padding:12px}.hero{min-height:175px}.grid2,.grid3,.bento{grid-template-columns:1fr}.switcher{top:6px}}

const FLOW_META={
 buyer:{title:"Kanzpay Rewards & Gold · Buyer",start:"home"},
 seller:{title:"Kanzpay Rewards & Gold · Seller",start:"start"}
};
let role="buyer", state={buyer:"home",seller:"start"}, history={buyer:[],seller:[]};

const M={
 buyer:{
  home:["I’m here with you.","Tap or scan — I’ll stay with the exact path you choose."],
  checkUser:["One simple decision.","Existing User keeps your context. New User begins with mobile."],
  newGold:["Mabrook.","Your 1 mg Gold moment is here. Let’s build the Value Vault."],
  invoiceShared:["Let’s see what the invoice changed.","Yes starts the gamified engine. No checks the Value Vault."],
  shareVault:["Your value stays yours.","I’ll show what can be connected before asking for permission."],
  cockpit:["This is your Cockpit.","Six living places. Each one maps to the supplied journey."],
  payment:["I found the intelligence layer.","I’ll ask before recommendation logic does anything."],
  allSet:["All Set to Earn more.","Create account is the next numbered step."]
 },
 seller:{
  start:["I’m setting up the shop.","The assistant stays in the background after setup."],
  installAssistant:["Let’s make the shop recognisable.","Business type, location, logo and pictures become its identity."],
  vaultShared:["One seller decision matters here.","No goes to invoice. Yes adjusts the shared value first."],
  rewardRules:["Now the rules become value.","Every invoice can follow the same points, discount, free product and Gold logic."],
  dashboard:["The assistant becomes your trigger.","Choose the store, then Focus or Intelligence."],
  focus:["Focus is the operating pulse.","Commission, tickets, rewards, trends and customers."],
  intelligence:["Intelligence is the growth layer.","Catalogue, inventory, finance and payment instruments."]
 }
};

function F(){return role==="buyer"?BUYER:SELLER}
function N(){return F()[state[role]]}
function labelNext(label){return label}
function icon(label){
 if(label.includes("Tap"))return "◉"; if(label.includes("Scan")||label.includes("QR"))return "⌁";
 if(label.includes("Gold"))return "Au"; if(label.includes("Card"))return "C"; if(label.includes("Value"))return "V";
 if(label.includes("Create")||label.includes("Emirates"))return "ID"; if(label.includes("User"))return "◌";
 if(label.includes("Invoice"))return "▤"; return "•";
}
function benefit(label){
 const map={"Tap":"Start instantly without searching.","Scan":"Start from the camera URL link.","Existing User":"Keep your existing context.","New User":"Begin a lighter account path.","Yes":"Continue on the selected branch.","No":"Continue on the selected branch.","Cockpit":"Return to the six living modules.","Back to Cockpit":"Return to the six living modules.","Create account":"Secure the value layer with identity.","All Set to Earn more":"Move into the next numbered step.","Take permission":"Approve only the value you want connected.","Dynamic QR code":"Choose how the app connection should behave."};
 return map[label]||"Continue this exact flow step with the benefit visible.";
}
function toast(t){const x=document.getElementById("toast");x.textContent=t;x.classList.add("show");clearTimeout(window._toast);window._toast=setTimeout(()=>x.classList.remove("show"),1500)}
function celebrate(){const b=document.getElementById("confetti");b.innerHTML="";for(let i=0;i<68;i++){const d=document.createElement("i");d.className="piece";d.style.left=(43+Math.random()*14)+"%";d.style.setProperty("--x",((Math.random()-.5)*86)+"vw");d.style.background=["#f2d789","#fff0b5","#9fc8a7","#d2a43b","#fff"][i%5];d.style.animationDelay=(Math.random()*.25)+"s";b.appendChild(d)}setTimeout(()=>b.innerHTML="",2200)}
function flowMark(n){return '<div class="flowBar"><b>'+n.n+'</b><span>'+n.t+'</span><em>'+n.e+'</em></div>'}
function hero(n){return '<div class="hero"><img src="'+IMG[n.img]+'"><div class="heroText"><div class="eyebrow">'+n.e+'</div><h1>'+n.t+'</h1><p>'+n.p+'</p></div></div>'}
function panelItems(items){if(!items||!items.length)return"";return '<div class="rail">'+items.map((x,i)=>'<div class="glass tile"><strong>'+x+'</strong><span>'+((i<4)?"Visible from the supplied flow":"Flow detail")+'</span><b>'+((i<4)?"STEP":"DETAIL")+'</b></div>').join("")+'</div>'}
function specialized(n){
 let h="";
 if(n.t==="COCKPIT") h+='<div class="bento">'+n.o.map(o=>choice(o[0],o[1])).join("")+'</div>';
 if(n.t==="My Visiting Card") h+='<div class="cardHero"><img src="'+IMG.card+'"><div class="cardCopy"><div class="cardBrand">KANZPAY CONNECT</div><div><div class="cardName">Your identity, your way</div><div class="sub">Glass · image · metallic Gold</div></div><div><span class="tag">NFC</span> <span class="tag">QR</span> <span class="tag">Share</span></div></div></div>';
 if(n.t==="My Gold Vault") h+='<div class="goldHero"><div class="coin">Au</div><div class="goldCopy"><strong>Gold Vault</strong><span>Weight · +/- % vs purchase · Powered by SafeGold</span></div></div>';
 if(n.t==="My Expenses") h+='<div class="glass chart"><i class="bar" style="height:37%"></i><i class="bar" style="height:54%"></i><i class="bar" style="height:48%"></i><i class="bar" style="height:73%"></i><i class="bar" style="height:58%"></i><i class="bar" style="height:88%"></i></div><div class="pie"></div>';
 if(n.t==="Payment instrument intelligence inbuilt") h+='<div class="rail"><div class="glass instrument"><span>Cards BIN info</span><strong>Offers</strong><b>READY</b></div><div class="glass instrument"><span>Lean AIS</span><strong>Instrument data</strong><b>READY</b></div></div>';
 if(n.t==="Create account") h+='<div class="grid2"><div class="glass panel"><div class="metric"><strong>1</strong><span class="tiny">DOCUMENT</span></div><div class="sub">Emirates ID front-back</div></div><div class="glass panel"><div class="metric"><strong>2</strong><span class="tiny">LIVE</span></div><div class="sub">Camera instructions</div></div><div class="glass panel"><div class="metric"><strong>3</strong><span class="tiny">MATCH</span></div><div class="sub">Photo match</div></div><div class="glass panel"><div class="metric"><strong>4</strong><span class="tiny">AML</span></div><div class="sub">Final check</div></div></div>';
 if(n.t.includes("Live camera")) h+='<div class="camera"><img src="'+IMG.camera+'"><i class="dot" style="left:39%;top:36%"></i><i class="dot" style="left:57%;top:36%"></i><i class="dot" style="left:48%;top:57%"></i></div>';
 if(n.t.includes("Emirates ID")&&n.t.toLowerCase().includes("front")) h+='<div class="idCard"><div class="idLines"><i style="width:80%"></i><i style="width:64%"></i><i style="width:90%"></i></div></div>';
 return h;
}
function choice(label,next){return '<button class="glass node" onclick="go(\''+next+'\')"><div class="ico">'+icon(label)+'</div><strong>'+label+'</strong><span>Benefit: '+benefit(label)+'</span></button>'}
function go(next){const f=F();if(!f[next])return;history[role].push(state[role]);state[role]=next;render()}
function back(){state[role]=history[role].pop()||FLOW_META[role].start;render()}
function setRole(r){role=r;history[r]=[];state[r]=FLOW_META[r].start;document.getElementById("buyerTab").classList.toggle("active",r==="buyer");document.getElementById("sellerTab").classList.toggle("active",r==="seller");render()}
function toggleA(){document.getElementById("assistant").classList.toggle("open")}
function render(){
 const n=N(), m=(M[role][state[role]]||["I’m here with you.","I’ll stay beside you through the exact flow."]);
 document.getElementById("aTitle").textContent=m[0];document.getElementById("aBody").textContent=m[1];
 document.getElementById("assistant").classList.add("open");clearTimeout(window._a);window._a=setTimeout(()=>document.getElementById("assistant").classList.remove("open"),5000);
 document.getElementById("top").innerHTML=(history[role].length?'<button style="font-size:8px;color:var(--muted)" onclick="back()">‹ Back</button>':'<div class="brand">KANZ<span>PAY</span></div>')+'<span class="tiny">'+role.toUpperCase()+' · CH1.0</span>';
 if(n.celebrate)celebrate();
 let body=flowMark(n)+hero(n)+specialized(n)+panelItems(n.items);
 if(n.t==="COCKPIT"){} else if(n.o&&n.o.length) body+='<div class="grid2">'+n.o.map(o=>choice(o[0],o[1])).join("")+'</div>';
 if(n.t==="COCKPIT") body+='<div class="panel glass"><div class="metric"><strong>Value & Wealth Building</strong><span class="tiny">LIVE</span></div><div class="sub">Six modules are now visible as living places, not a report.</div></div>';
 if(!n.o?.length && n.e==="Module") body+='<div class="ctaWrap"><button class="cta primary" onclick="back()"><b>Back to Cockpit</b><small>Benefit: return without changing the supplied flow.</small></button></div>';
 document.getElementById("stage").innerHTML='<div class="screen">'+body+'</div>';
}
render();
</script>
