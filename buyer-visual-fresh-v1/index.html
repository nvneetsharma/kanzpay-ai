<style>

body{overflow:hidden}button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#app{position:fixed;inset:0;overflow:hidden;background:radial-gradient(circle at 50% 8%,rgba(241,212,126,.10),transparent 28%),radial-gradient(circle at 10% 90%,rgba(78,112,86,.09),transparent 28%),linear-gradient(155deg,#080b08,#040604 72%,#070907)}
#app:before{content:"";position:absolute;inset:-20%;background:radial-gradient(circle at 72% 22%,rgba(255,255,255,.025),transparent 18%),radial-gradient(circle at 25% 78%,rgba(241,212,126,.025),transparent 20%);filter:blur(18px);animation:drift 16s ease-in-out infinite alternate}

.top{display:flex;align-items:center;justify-content:space-between;min-height:33px}
.brand{font-size:12px;letter-spacing:.22em;font-weight:950}.brand span{color:var(--gold2)}.tiny{font-size:8px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}

.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.58}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,6,4,.02),rgba(4,6,4,.15) 42%,rgba(4,6,4,.93) 100%)}
.heroCopy{position:absolute;left:19px;right:19px;bottom:17px;z-index:2}.eyebrow{font-size:8px;color:var(--gold2);text-transform:uppercase;letter-spacing:.20em;margin-bottom:8px}.hero h1{font-size:33px;line-height:.96;letter-spacing:-.055em;margin:0}.hero p{font-size:10px;line-height:1.45;color:#d0cdc2;margin:7px 0 0;max-width:330px}
.glass{position:relative;background:linear-gradient(145deg,rgba(255,255,255,.055),rgba(255,255,255,.012));border:1px solid var(--line);border-radius:23px;box-shadow:0 23px 70px rgba(0,0,0,.40),inset 0 1px 0 rgba(255,255,255,.03);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);overflow:hidden}.glass:after{content:"";position:absolute;inset:-50% -20%;background:linear-gradient(110deg,transparent 39%,rgba(255,255,255,.04) 49%,transparent 60%);transform:translateX(-60%) rotate(8deg);animation:sheen 9s ease-in-out infinite;pointer-events:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}

.profileRail{display:flex;gap:7px;overflow:auto;margin-top:9px;padding-bottom:4px}.profileRail button{flex:0 0 auto;padding:8px 10px;border-radius:13px;border:1px solid var(--line);background:rgba(255,255,255,.02);font-size:8px;color:var(--muted)}.profileRail button.active{border-color:rgba(241,212,126,.48);color:var(--gold2);background:rgba(241,212,126,.07)}
.glassCard{position:relative;min-height:190px;border-radius:27px;overflow:hidden;border:1px solid rgba(241,212,126,.28);background:linear-gradient(135deg,rgba(239,220,160,.13),rgba(255,255,255,.03));box-shadow:inset 0 1px 0 rgba(255,255,255,.09),0 28px 85px rgba(0,0,0,.48);backdrop-filter:blur(27px);-webkit-backdrop-filter:blur(27px)}.glassCard:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(7,9,7,.94),rgba(7,9,7,.64) 53%,rgba(7,9,7,.18));z-index:1}.glassCard img{position:absolute;right:0;top:0;width:51%;height:100%;object-fit:cover;opacity:.74;mask-image:linear-gradient(90deg,transparent,black 45%);-webkit-mask-image:linear-gradient(90deg,transparent,black 45%)}.cardInfo{position:relative;z-index:2;width:69%;height:100%;padding:15px;display:flex;flex-direction:column;justify-content:space-between}.cardBrand{font-size:8px;letter-spacing:.19em;color:var(--gold2);font-weight:900}.cardName{font-size:24px;font-weight:950;letter-spacing:-.05em}.cardRole{font-size:8px;color:#d5d1c6}.tags{display:flex;gap:5px;flex-wrap:wrap}.tag{font-size:7px;padding:5px 7px;border:1px solid var(--line);border-radius:99px;color:var(--muted)}
.instrument{min-width:185px;padding:11px;min-height:105px;text-align:left}.instrument.connected{border-color:rgba(241,212,126,.35)}.instrument .status{display:flex;justify-content:space-between;color:var(--muted);font-size:8px}.instrument strong{display:block;font-size:14px;margin-top:14px}.instrument .foot{display:flex;justify-content:space-between;font-size:8px;color:var(--muted);margin-top:9px}.instrument b{color:var(--gold2)}
.chartBox{height:107px;padding:12px;display:flex;gap:7px;align-items:flex-end}.bar{flex:1;border-radius:8px 8px 2px 2px;background:linear-gradient(180deg,#f1d47e,#71531c);box-shadow:0 0 14px rgba(241,212,126,.12)}.bar.b1{height:34%}.bar.b2{height:50%}.bar.b3{height:43%}.bar.b4{height:70%}.bar.b5{height:56%}.bar.b6{height:88%}
.pie{height:150px;width:150px;border-radius:50%;background:conic-gradient(#f1d47e 0 36%,#6a8c72 36% 58%,#7b6437 58% 76%,#39463d 76%);margin:0 auto;position:relative;box-shadow:0 0 32px rgba(241,212,126,.09)}.pie:after{content:"";position:absolute;inset:39px;border-radius:50%;background:#0b0e0b}
.goldHero{min-height:175px;position:relative;border-radius:28px;overflow:hidden;border:1px solid var(--line);background:radial-gradient(circle at 50% 50%,rgba(241,212,126,.17),rgba(7,9,7,.86) 57%)}.goldCoin{position:absolute;left:50%;top:50%;transform:translate(-50%,-55%);width:94px;height:94px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 32% 24%,#fff2bb,#efd074 20%,#aa7820 58%,#44300c);color:#553c08;font-size:24px;font-weight:950;box-shadow:0 0 52px rgba(241,212,126,.34);animation:spin 7s linear infinite}.goldAmount{position:absolute;left:18px;bottom:13px;z-index:2}.goldAmount strong{display:block;font-size:27px}.goldAmount span{font-size:8px;color:var(--muted)}
.actionGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:9px}.actionGrid button{padding:9px 6px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.02);font-size:8px}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}.checkCard{padding:10px;text-align:left}.checkCard b{font-size:17px;color:var(--gold2)}.checkCard span{display:block;font-size:8px;color:var(--muted);margin-top:3px}
.idcard{height:145px;position:relative;border-radius:18px;background:linear-gradient(145deg,#e7dfcb,#948e76);box-shadow:0 22px 54px rgba(0,0,0,.38);overflow:hidden}.idphoto{position:absolute;left:13px;top:17px;width:52px;height:66px;border-radius:9px;background:linear-gradient(145deg,#d8ac8d,#704b38)}.idlines{position:absolute;left:78px;right:14px;top:18px}.idlines i{display:block;height:6px;border-radius:5px;background:rgba(55,51,39,.22);margin-bottom:7px}.seal{position:absolute;right:13px;bottom:10px;width:26px;height:26px;border-radius:50%;border:2px solid rgba(58,52,38,.24)}
.camera{height:165px;position:relative;border-radius:25px;overflow:hidden;border:1px solid var(--line);background:linear-gradient(145deg,#162019,#070907);display:grid;place-items:center}.camera img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.48}.camera:after{content:"";position:absolute;inset:19px;border:1px solid rgba(241,212,126,.48);border-radius:19px;box-shadow:0 0 35px rgba(241,212,126,.12) inset}.dot{position:absolute;z-index:2;width:9px;height:9px;border-radius:50%;background:var(--gold2);box-shadow:0 0 17px rgba(241,212,126,.82);animation:breathe 2s ease-in-out infinite}.d1{left:39%;top:36%}.d2{left:57%;top:36%;animation-delay:.3s}.d3{left:48%;top:57%;animation-delay:.7s}
.assistant{position:absolute;left:14px;right:14px;bottom:17px;z-index:20;display:flex;justify-content:flex-end;pointer-events:none}.assistant.open .bubble{opacity:1;transform:translateY(0)}.bubble{max-width:290px;margin-right:8px;padding:10px 12px;border-radius:18px;background:rgba(14,17,14,.90);border:1px solid rgba(241,212,126,.20);box-shadow:0 18px 50px rgba(0,0,0,.44);backdrop-filter:blur(20px);opacity:0;transform:translateY(8px);transition:.28s}.bubble small{display:block;color:var(--gold2);font-size:7px;letter-spacing:.16em}.bubble strong{display:block;font-size:11px;margin-top:4px}.bubble span{display:block;color:var(--muted);font-size:8px;line-height:1.35;margin-top:2px}.assistantFace{width:50px;height:50px;border-radius:50%;pointer-events:auto;position:relative;border:1px solid rgba(241,212,126,.44);background:radial-gradient(circle at 35% 30%,#f8e49d,#a97b24 42%,#4b350c 72%);box-shadow:0 0 34px rgba(241,212,126,.22);font-weight:950;color:#3f2b08}.assistantFace:before,.assistantFace:after{content:"";position:absolute;border:1px solid rgba(241,212,126,.18);border-radius:50%;inset:-7px;animation:pulse 3.6s ease-in-out infinite}.assistantFace:after{inset:-15px;opacity:.4;animation-delay:1.1s}.assistantFace b{position:relative;z-index:2}.footer{height:28px;display:flex;justify-content:space-between;align-items:center;margin-top:6px}.footer button{font-size:8px;color:var(--muted)}
.confetti{position:fixed;inset:0;z-index:100;pointer-events:none;overflow:hidden}.piece{position:absolute;width:8px;height:15px;border-radius:2px;animation:fall 1.8s cubic-bezier(.2,.8,.2,1) forwards}
.toast{position:fixed;left:50%;bottom:75px;transform:translateX(-50%) translateY(15px);z-index:90;padding:9px 12px;border-radius:12px;background:rgba(14,17,14,.94);border:1px solid var(--line);font-size:9px;color:var(--gold2);opacity:0;pointer-events:none;transition:.22s}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@keyframes in{from{opacity:0;transform:translateY(9px) scale(.99)}to{opacity:1;transform:none}}@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}@keyframes pulse{0%,100%{opacity:.35;transform:scale(.96)}50%{opacity:.9;transform:scale(1.02)}}@keyframes spin{to{transform:translate(-50%,-55%) rotate(360deg)}}@keyframes sheen{0%,60%{transform:translateX(-65%) rotate(8deg)}85%,100%{transform:translateX(60%) rotate(8deg)}}@keyframes fall{from{transform:translate3d(0,-10vh,0) rotate(0deg);opacity:1}to{transform:translate3d(var(--x),110vh,0) rotate(680deg);opacity:0}}@keyframes drift{from{transform:translate3d(-1%,0,0)}to{transform:translate3d(1%,1%,0)}}
@media(max-height:760px){.hero{min-height:160px}.choice{min-height:112px}.goldHero{min-height:150px}.glassCard{min-height:170px}.camera{height:145px}}
</style></head>
<body><div id="app"><div class="shell"><div class="top" id="top"></div><div class="stage" id="stage"></div><div class="assistant" id="assistant"><div class="bubble"><small>K-ASSISTANT</small><strong id="at">I’m here with you.</strong><span id="ab">I’ll guide the next useful step and keep the choices yours.</span></div><button class="assistantFace" onclick="toggleAssistant()">K</button></div><div class="footer"><button onclick="goBack()">‹ Back</button><span class="tiny" id="status">Flow accurate</span></div></div><div class="toast" id="toast"></div><div class="confetti" id="confetti"></div></div>
<script>
const S={history:[],step:"start",entry:"tap",existing:false,invoiceShared:false,profile:"Personal",cardAvailable:false,template:"Executive",connectType:"Membership",period:"Monthly",pay:"ADCB A2A"};
const img={life:"https://images.unsplash.com/photo-1529156069898-49953e39b3ac?auto=format&fit=crop&w=1000&q=84",store:"https://images.unsplash.com/photo-1472851294608-062f824d29cc?auto=format&fit=crop&w=1000&q=84",people:"https://images.unsplash.com/photo-1521737711867-e3b97375b3ac?auto=format&fit=crop&w=1000&q=84",card:"https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=900&q=84",work:"https://images.unsplash.com/photo-1556761175-b413da4baf72?auto=format&fit=crop&w=1000&q=84",gold:"https://images.unsplash.com/photo-1610375461246-83df859d849d?auto=format&fit=crop&w=1000&q=84",money:"https://images.unsplash.com/photo-1554224155-8d04cb21cd6c?auto=format&fit=crop&w=1000&q=84",pay:"https://images.unsplash.com/photo-1556742049-0cfed4f6a45d?auto=format&fit=crop&w=1000&q=84",id:"https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=900&q=84"};
const assistant={
start:["I’m here with you.","Start with a tap or scan. I’ll recognise the store and keep the path simple."],
entry:["I’ve got the connection.","The store link is ready. Open it and I’ll bring the useful choices forward."],
app:["I found your store.","Maps, seller offers and the live catalogue are ready. You choose where to go."],
user:["One simple choice.","Already with us? I’ll bring your value back. New here? I’ll make the beginning light."],
newmobile:["Just your mobile.","One number gets us started — no long form."],
newotp:["Almost done.","One code, then we keep moving."],
newemail:["Your email.","This becomes part of your digital identity and recovery path."],
newemailotp:["One last check.","Verify the code and your first little win is waiting."],
welcome:["Mabrook.","Your first 1 mg is yours. Next, we build the Value Vault around what you already own."],
vaultintro:["Bring your value together.","I’ll show what can be connected and what it can add before you approve anything."],
vault:["This is your Value Vault.","Memberships, reward points, promo codes and vouchers become visible in one place."],
vaultperm:["You stay in control.","I’ll show the exact permission, validity and value before the programme connects."],
vaultupdated:["Your Vault just got stronger.","The approved value is stored with history and validity so you can use it later."],
existing:["Let’s see what the store sent.","Was an invoice shared? That decides whether we unlock the gamified value engine."],
invoiceyes:["That was worth it.","Your invoice has triggered the gamified value engine. Let’s bring your six places together."],
invoiceno:["No invoice yet.","You can still navigate to the store, seller offers or live catalogue."],
cockpit:["This is your Cockpit.","Six living places. I’ll surface the useful action without making you hunt."],
card:["Let’s make it feel like you.","Your relationship, profile and template will stay together across every share."],
cardtemplate:["Now the design.","Glass, imagery and metallic gold should feel like a real card in your hand."],
cardedit:["One identity everywhere.","Edit the information once, then choose how you share it."],
friends:["Bring someone along.","The invitation is yours to send — I’ll make it easy."],
gold:["Your gold is yours.","Buy, sell, redeem, deliver, gift or use it — whenever you choose."],
expenses:["Let’s make the numbers human.","See the pattern by day, week, month or year, not a wall of figures."],
payment:["I found an option.","I’ll show the benefit and ask you before anything is activated."],
store:["Here’s Grand Gifts.","The live catalogue is connected to your value and offers."],
catalogue:["Choose what feels right.","Every product carries its price, offer and the value that can come back."],
checkout:["Everything looks right.","Items, price and offer are checked before you pay."],
pay:["Your choice.","A2A first, cards next. I’ll show the route and the benefit before you confirm."],
success:["Mabrook.","The purchase is complete and gold has come back into your Vault."],
create:["I’ll stay with you.","Four small identity steps. I’ll explain each one before you do it."],
idfront:["Front first.","Hold the Emirates ID steady. I’ll help you capture and crop it."],
idback:["Now the back.","Turn it over and keep the edges inside the frame."],
live:["Blink. Left. Right.","That’s the live match. I’m right here with you."],
aml:["Everything matches.","Photo match and AML are complete. Your account is ready."]
};
function cta(label,benefit,fn,primary=true){return '<div class="ctaWrap"><button class="cta '+(primary?'primary':'')+'" onclick="'+fn+'"><span class="label">'+label+'</span><small>Benefit: '+benefit+'</small></button></div>'}
function top(label,back=true){document.getElementById("top").innerHTML=(back?'<button class="footerBtn" style="font-size:8px;color:var(--muted)" onclick="goBack()">‹ '+label+'</button>':'<div class="brand">K<span>ANZPAY</span></div>')+'<span class="tiny">'+(S.step==="cockpit"?"COCKPIT":"BUYER")+'</span>'}
function hero(ey,title,copy,pic){return '<div class="hero"><img src="'+pic+'"><div class="heroCopy"><div class="eyebrow">'+ey+'</div><h1>'+title+'</h1><p>'+copy+'</p></div></div>'}
function section(title,sub,body){return '<div class="glass section"><div class="metric"><strong>'+title+'</strong><span class="tiny">'+sub+'</span></div><div class="sub">'+body+'</div></div>'}
function toast(t){const x=document.getElementById("toast");x.textContent=t;x.classList.add("show");clearTimeout(window.__toast);window.__toast=setTimeout(()=>x.classList.remove("show"),1500)}
function celebrate(){const box=document.getElementById("confetti");box.innerHTML="";for(let i=0;i<72;i++){const d=document.createElement("i");d.className="piece";d.style.left=(45+Math.random()*10)+"%";d.style.setProperty("--x",((Math.random()-.5)*70)+"vw");d.style.background=["#f1d47e","#fff0b5","#9ec8a5","#d2a43b","#ffffff"][i%5];d.style.animationDelay=(Math.random()*.28)+"s";box.appendChild(d)}setTimeout(()=>box.innerHTML="",2200)}
function setAssistant(){const m=assistant[S.step]||assistant.start;document.getElementById("at").textContent=m[0];document.getElementById("ab").textContent=m[1];document.getElementById("assistant").classList.add("open");clearTimeout(window.__a);window.__a=setTimeout(()=>document.getElementById("assistant").classList.remove("open"),5200)}
function toggleAssistant(){document.getElementById("assistant").classList.toggle("open")}
function nav(id){if(id!==S.step)S.history.push(S.step);S.step=id;render()}
function goBack(){const p=S.history.pop();S.step=p||"start";render()}
function share(kind){celebrate();toast(kind+" share ready")}
function render(){
const st=document.getElementById("stage"),s=S.step;setAssistant();
if(s==="start"){top("",false);st.innerHTML=hero("Commerce that feels like life","Start with a tap.<br>We’ll take it from there.","Your store, your choices, your value — with K-Assistant beside you.",img.life)+'<div class="grid2"><button class="glass choice" onclick="S.entry=&quot;tap&quot;;nav(&quot;entry&quot;)"><div class="ico">◉</div><strong>Tap to start</strong><span>NFC / phone tap<br>Instant store recognition.</span></button><button class="glass choice" onclick="S.entry=&quot;scan&quot;;nav(&quot;entry&quot;)"><div class="ico">⌁</div><strong>Scan to start</strong><span>Camera / URL scan<br>Open the connected experience.</span></button></div>';return}
