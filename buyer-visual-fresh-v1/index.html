<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#050705">
<title>KANZPAY — Buyer Journey</title>
<style>
:root{--bg:#050705;--ink:#f6f1e5;--muted:#aaa59a;--gold:#c59a2e;--gold2:#f2d789;--gold3:#fff0b5;--green:#8db89a;--line:rgba(242,215,137,.18)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#app{position:fixed;inset:0;overflow:hidden;background:radial-gradient(circle at 50% 8%,rgba(242,215,137,.09),transparent 28%),radial-gradient(circle at 8% 85%,rgba(82,116,91,.08),transparent 28%),linear-gradient(155deg,#080b08,#040604 72%,#070907)}
#app:after{content:"";position:absolute;inset:-20%;background:radial-gradient(circle at 75% 25%,rgba(255,255,255,.025),transparent 18%);filter:blur(18px);animation:drift 15s ease-in-out infinite alternate}
.shell{position:absolute;inset:0;z-index:2;width:min(470px,100%);margin:auto;padding:15px 15px 20px;display:flex;flex-direction:column}
.top{min-height:32px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:12px;letter-spacing:.22em;font-weight:950}.brand span{color:var(--gold2)}.tiny{font-size:8px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.stage{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;overflow:hidden}.view{animation:in .38s ease-out both}
.hero{position:relative;min-height:185px;border:1px solid var(--line);border-radius:29px;overflow:hidden;background:rgba(8,11,8,.5);box-shadow:0 28px 85px rgba(0,0,0,.46);backdrop-filter:blur(22px)}.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.55}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(3,5,3,.03),rgba(3,5,3,.88) 100%)}.heroCopy{position:absolute;left:18px;right:18px;bottom:16px;z-index:2}.eyebrow{font-size:8px;color:var(--gold2);letter-spacing:.2em;text-transform:uppercase;margin-bottom:7px}.hero h1{font-size:32px;line-height:.96;letter-spacing:-.055em;margin:0}.hero p{font-size:10px;line-height:1.45;color:#d0cdc4;margin:7px 0 0;max-width:340px}
.glass{position:relative;background:linear-gradient(145deg,rgba(255,255,255,.055),rgba(255,255,255,.012));border:1px solid var(--line);border-radius:22px;box-shadow:0 25px 75px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.03);backdrop-filter:blur(23px);overflow:hidden}.glass:after{content:"";position:absolute;inset:-50% -20%;background:linear-gradient(110deg,transparent 39%,rgba(255,255,255,.04) 49%,transparent 60%);transform:translateX(-60%) rotate(8deg);animation:sheen 9s ease-in-out infinite;pointer-events:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.choice{padding:12px;text-align:left;min-height:120px}.choice strong{display:block;font-size:13px;margin-top:13px}.choice span{display:block;font-size:9px;color:var(--muted);line-height:1.42;margin-top:4px}.ico{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;border:1px solid var(--line);background:rgba(242,215,137,.05);color:var(--gold2);font-size:19px}
.section{padding:12px;margin-top:9px}.metric{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.metric strong{font-size:16px;line-height:1.1}.sub{font-size:9px;line-height:1.45;color:var(--muted);margin-top:5px}
.ctaWrap{margin-top:10px}.cta{width:100%;padding:10px 13px;border-radius:15px;border:1px solid var(--line);background:rgba(255,255,255,.025);text-align:left;font-weight:900}.cta.primary{background:linear-gradient(135deg,#f9e5a0,#bd912a);color:#171308;border:0}.cta .label{display:block;font-size:11px}.cta small{display:block;font-size:8px;line-height:1.35;margin-top:3px;font-weight:650;opacity:.75}.cta.primary small{color:#4f3b09;opacity:.9}
.rail{display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;padding:2px 1px 7px;margin-top:8px}.rail::-webkit-scrollbar{display:none}.tile{flex:0 0 152px;padding:11px;text-align:left}.tile strong{display:block;font-size:12px}.tile span{display:block;font-size:8px;color:var(--muted);line-height:1.4;margin-top:3px}.tile b{display:block;color:var(--gold2);font-size:10px;margin-top:12px}
.kCard{min-height:150px;padding:14px}.kCard h3{margin:0;font-size:14px}.kCard p{font-size:9px;color:var(--muted);line-height:1.4}
.cardHero{position:relative;min-height:190px;border-radius:27px;overflow:hidden;border:1px solid rgba(242,215,137,.26);background:linear-gradient(135deg,rgba(240,221,166,.13),rgba(255,255,255,.03));box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 25px 75px rgba(0,0,0,.48);backdrop-filter:blur(25px)}.cardHero img{position:absolute;right:0;top:0;width:52%;height:100%;object-fit:cover;opacity:.72;mask-image:linear-gradient(90deg,transparent 0,black 45%);-webkit-mask-image:linear-gradient(90deg,transparent 0,black 45%)}.cardHero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(7,9,7,.94),rgba(7,9,7,.63) 55%,rgba(7,9,7,.14));pointer-events:none}.cardInfo{position:relative;z-index:2;width:68%;height:100%;padding:15px;display:flex;flex-direction:column;justify-content:space-between}.cardBrand{font-size:8px;letter-spacing:.18em;color:var(--gold2);font-weight:900}.cardName{font-size:24px;font-weight:950;letter-spacing:-.05em}.cardRole{font-size:8px;color:#d4d0c5}.tag{padding:5px 7px;border-radius:99px;border:1px solid var(--line);font-size:7px;color:var(--muted)}
.goldHero{height:172px;border-radius:28px;position:relative;overflow:hidden;border:1px solid var(--line);background:radial-gradient(circle at 50% 50%,rgba(242,215,137,.17),rgba(6,8,6,.86) 58%)}.coin{position:absolute;left:50%;top:49%;transform:translate(-50%,-50%);width:92px;height:92px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 30% 24%,#fff2bd,#f0d376 20%,#ae7b21 58%,#44300d);color:#543a08;font-weight:950;box-shadow:0 0 50px rgba(242,215,137,.34);animation:spin 7s linear infinite}.goldText{color:var(--gold2)}
.chart{height:100px;padding:11px;display:flex;align-items:flex-end;gap:7px}.bar{flex:1;border-radius:8px 8px 2px 2px;background:linear-gradient(#f2d789,#70511b)}.pie{width:145px;height:145px;margin:10px auto 0;border-radius:50%;background:conic-gradient(#f2d789 0 36%,#709477 36% 58%,#7d673a 58% 76%,#3c473e 76%);position:relative}.pie:after{content:"";position:absolute;inset:38px;background:#0a0d0a;border-radius:50%}
.instrument{flex:0 0 182px;padding:11px;min-height:105px;text-align:left}.instrument strong{display:block;font-size:13px;margin-top:15px}.instrument .foot{display:flex;justify-content:space-between;font-size:8px;color:var(--muted);margin-top:9px}.instrument b{color:var(--gold2)}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}.check{padding:10px;text-align:left}.check b{font-size:17px;color:var(--gold2)}.check span{display:block;font-size:8px;color:var(--muted);margin-top:3px}
.id{height:145px;position:relative;border-radius:17px;background:linear-gradient(145deg,#e8dfc9,#969079);box-shadow:0 20px 54px rgba(0,0,0,.4);overflow:hidden}.id:before{content:"";position:absolute;left:14px;top:18px;width:51px;height:65px;border-radius:9px;background:linear-gradient(145deg,#d8ac8f,#704a39)}.idLines{position:absolute;left:78px;right:14px;top:18px}.idLines i{display:block;height:6px;background:rgba(58,54,41,.23);border-radius:5px;margin-bottom:7px}.cam{height:158px;position:relative;border-radius:25px;overflow:hidden;border:1px solid var(--line);background:#101610;display:grid;place-items:center}.cam img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.46}.cam:after{content:"";position:absolute;inset:19px;border:1px solid rgba(242,215,137,.5);border-radius:19px;box-shadow:0 0 30px rgba(242,215,137,.12) inset}.dot{position:absolute;z-index:2;width:9px;height:9px;border-radius:50%;background:var(--gold2);box-shadow:0 0 17px rgba(242,215,137,.85);animation:pulse 2.2s ease-in-out infinite}
.assistant{position:absolute;left:14px;right:14px;bottom:17px;z-index:30;display:flex;justify-content:flex-end;align-items:flex-end;gap:8px;pointer-events:none}.bubble{max-width:285px;padding:10px 12px;border-radius:18px;background:rgba(14,17,14,.91);border:1px solid var(--line);box-shadow:0 18px 50px rgba(0,0,0,.45);backdrop-filter:blur(20px);opacity:0;transform:translateY(8px);transition:.25s}.assistant.open .bubble{opacity:1;transform:none}.bubble small{display:block;font-size:7px;letter-spacing:.15em;color:var(--gold2)}.bubble strong{display:block;font-size:11px;margin-top:3px}.bubble span{display:block;font-size:8px;line-height:1.35;color:var(--muted);margin-top:2px}.face{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;pointer-events:auto;background:radial-gradient(circle at 35% 25%,#f9e6a2,#a87823 42%,#48320c);border:1px solid rgba(242,215,137,.42);color:#3d2a08;font-weight:950;box-shadow:0 0 35px rgba(242,215,137,.2);position:relative}.face:before,.face:after{content:"";position:absolute;border:1px solid rgba(242,215,137,.18);border-radius:50%;inset:-7px;animation:pulse 3.7s ease-in-out infinite}.face:after{inset:-15px;opacity:.4;animation-delay:1s}
.confetti{position:fixed;inset:0;z-index:100;pointer-events:none;overflow:hidden}.piece{position:absolute;width:8px;height:15px;border-radius:2px;animation:fall 1.8s cubic-bezier(.2,.8,.2,1) forwards}.toast{position:fixed;left:50%;bottom:76px;z-index:90;transform:translate(-50%,10px);padding:9px 12px;border-radius:12px;background:rgba(14,17,14,.95);border:1px solid var(--line);font-size:9px;color:var(--gold2);opacity:0;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
@keyframes in{from{opacity:0;transform:translateY(9px) scale(.99)}to{opacity:1;transform:none}}@keyframes pulse{0%,100%{opacity:.35;transform:scale(.96)}50%{opacity:.9;transform:scale(1.02)}}@keyframes fall{from{transform:translate3d(0,-10vh,0) rotate(0);opacity:1}to{transform:translate3d(var(--x),110vh,0) rotate(680deg);opacity:0}}@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}@keyframes sheen{0%,60%{transform:translateX(-65%) rotate(8deg)}85%,100%{transform:translateX(60%) rotate(8deg)}}@keyframes drift{from{transform:translate3d(-1%,0,0)}to{transform:translate3d(1%,1%,0)}}
@media(max-height:720px){.hero{min-height:165px}.choice{min-height:105px}.cardHero{min-height:170px}.goldHero{height:155px}}
</style>
</head>
<body>
<div id="app"><div class="shell"><div class="top" id="top"></div><div class="stage" id="stage"></div>
<div class="assistant" id="assistant"><div class="bubble"><small>K-ASSISTANT</small><strong id="at"></strong><span id="ab"></span></div><button class="face" onclick="toggleAssistant()">K</button></div>
<div class="toast" id="toast"></div><div class="confetti" id="confetti"></div></div></div>
<script>
const S={history:[],step:"start",entry:"tap",existing:false,invoiceShared:false,redeemGift:false,redeemPoints:false,redeemCoupons:false,profile:"Personal",cardAvailable:false,shareMode:"NFC",template:"Executive",period:"Monthly",pay:"ADCB A2A"};
const img={life:"https://images.unsplash.com/photo-1529156069898-49953e39b3ac?auto=format&fit=crop&w=1000&q=84",store:"https://images.unsplash.com/photo-1472851294608-062f824d29cc?auto=format&fit=crop&w=1000&q=84",people:"https://images.unsplash.com/photo-1521737711867-e3b97375b3ac?auto=format&fit=crop&w=1000&q=84",card:"https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=900&q=84",gold:"https://images.unsplash.com/photo-1610375461246-83df859d849d?auto=format&fit=crop&w=1000&q=84",money:"https://images.unsplash.com/photo-1554224155-8d04cb21cd6c?auto=format&fit=crop&w=1000&q=84",pay:"https://images.unsplash.com/photo-1556742049-0cfed4f6a45d?auto=format&fit=crop&w=1000&q=84",id:"https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=900&q=84"};
const msg={
start:["I’m here with you.","Tap or scan. I’ll recognise the journey and stay beside you."],entry:["Connection received.","The Web App is starting from the URL you selected."],web:["I found the store.","Now we check your user status — then the correct path opens."],check:["One simple check.","Existing user or new user changes what happens next."],newMobile:["Let’s make the beginning easy.","Mobile first. Then one OTP, one email check and your first little Gold moment."],newOtp:["Almost there.","Verify the mobile and keep moving."],newEmail:["Now your email.","It becomes part of your digital identity."],newEmailOtp:["One last check.","Verify the email and your first Gold is waiting."],newGold:["Mabrook.","1 mg Gold has been credited. Next, we build your Value Vault."],vault:["This is your Value Vault.","Your memberships, points, promo codes and vouchers stay visible and under your control."],vaultEdit:["Choose the value.","I’ll show permission, validity and available value before anything connects."],vaultQr:["One connection at a time.","Store the QR in your Vault or follow the programme link into its app."],existing:["Let’s check the visit.","Was an invoice shared? That decides whether the gamified engine runs."],invoiceYes:["Your invoice worked for you.","The engine returns invoice intelligence, rewards and Gold."],invoiceNo:["No invoice yet.","Now we check whether the Value Vault is OK. If not, you can still reach the store."],vaultCheck:["Is your Value Vault OK?","A simple decision controls whether we move into your stored value or the store actions."],navigate:["You still have choices.","Store location, Seller Offers and Live Order Catalogue stay accessible."],cockpit:["This is your Cockpit.","Six modules, one view — each one built around a real part of your life."],vaultMod:["Bring your value together.","Show status, ask permission and keep each connected programme visible."],card:["Let’s make it feel like you.","The selected profile and template stay together across every share."],friends:["Bring someone along.","Explain the value, then share a link to your friend by WhatsApp, SMS or email."],gold:["Your Gold is yours.","See weight, change since purchase and the actions you can take."],expenses:["Let’s make the numbers human.","Category, period and charts show what your day is doing."],payment:["I found an option.","I’ll show the benefit and ask for approval before recommendation logic acts."],status:["All set to earn more.","Value & Wealth Building status is now visible."],create:["I’ll stay with you.","Front, back, live camera, crop/edit, photo match and AML — one guided sequence."]};
function top(label,back=true){document.getElementById("top").innerHTML=(back?'<button style="font-size:8px;color:var(--muted)" onclick="back()">‹ '+label+'</button>':'<div class="brand">K<span>ANZPAY</span></div>')+'<span class="tiny">BUYER</span>'}
function hero(ey,title,copy,p){return '<div class="hero"><img src="'+p+'"><div class="heroCopy"><div class="eyebrow">'+ey+'</div><h1>'+title+'</h1><p>'+copy+'</p></div></div>'}
function section(t,sub,body){return '<div class="glass section"><div class="metric"><strong>'+t+'</strong><span class="tiny">'+sub+'</span></div><div class="sub">'+body+'</div></div>'}
function cta(label,benefit,fn,primary=true){return '<div class="ctaWrap"><button class="cta '+(primary?'primary':'')+'" onclick="'+fn+'"><span class="label">'+label+'</span><small>Benefit: '+benefit+'</small></button></div>'}
function toast(t){const x=document.getElementById("toast");x.textContent=t;x.classList.add("show");clearTimeout(window._t);window._t=setTimeout(()=>x.classList.remove("show"),1500)}
function celebrate(){const box=document.getElementById("confetti");box.innerHTML="";for(let i=0;i<70;i++){const d=document.createElement("i");d.className="piece";d.style.left=(44+Math.random()*12)+"%";d.style.setProperty("--x",((Math.random()-.5)*85)+"vw");d.style.background=["#f2d789","#fff0b5","#9fc8a7","#d2a43b","#fff"][i%5];d.style.animationDelay=(Math.random()*.25)+"s";box.appendChild(d)}setTimeout(()=>box.innerHTML="",2200)}
function setA(){const m=msg[S.step]||msg.start;document.getElementById("at").textContent=m[0];document.getElementById("ab").textContent=m[1];document.getElementById("assistant").classList.add("open");clearTimeout(window._a);window._a=setTimeout(()=>document.getElementById("assistant").classList.remove("open"),5000)}
function toggleAssistant(){document.getElementById("assistant").classList.toggle("open")}
function nav(n){if(n!==S.step)S.history.push(S.step);S.step=n;render()}
function back(){S.step=S.history.pop()||"start";render()}
function choice(title,sub,icon,fn){return '<button class="glass choice" onclick="'+fn+'"><div class="ico">'+icon+'</div><strong>'+title+'</strong><span>'+sub+'</span></button>'}
function render(){
setA();const s=S.step,st=document.getElementById("stage");
if(s==="start"){top("",false);st.innerHTML=hero("Commerce that feels like life","@Phone: tap or scan to start the journey.","One small action begins the store experience. K-Assistant stays beside you.",img.life)+'<div class="grid2">'+choice("Tap","Click URL screen popup.","◉","S.entry='tap';nav(\'entry\')")+choice("Scan","Click camera URL link.","⌁","S.entry='scan';nav(\'entry\')")+'</div>';return}
if(s==="entry"){top("Start");st.innerHTML=hero(S.entry==="tap"?"Tap":"Scan","Web App Started","The URL is recognised and the connected experience is opening.",img.store)+section("Step 1","ACTION",S.entry==="tap"?"Tap → Click URL Screen Popup":"Scan → Click Camera URL Link")+cta("Open Web App","Start the store journey without searching for the seller.","nav(\'web\')");return}
if(s==="web"){top("Web App");st.innerHTML=hero("Store context","KanzPay connected experience","The store context is ready. Next, Check User decides the branch.",img.store)+cta("Check User","Choose the correct path without repeating onboarding steps.","nav(\'check\')");return}
if(s==="check"){top("Check User");st.innerHTML=hero("Step 2","Check User","Existing User? Yes continues to Invoice Shared. No starts mobile verification.",img.people)+'<div class="grid2">'+choice("Existing User","Yes → Invoice Shared","✓","S.existing=true;nav(\'invoice\')")+choice("New User","No → Mobile No","＋","S.existing=false;nav(\'newMobile\')")+'</div>';return}
if(s==="newMobile"){top("New User");st.innerHTML=hero("Mobile No.","Start simply.","Enter mobile number, then verify with one OTP.",img.pay)+section("Mobile No.","ACTION","Mobile number is the first credential in the new-user path.")+cta("Send OTP","Verify one number instead of asking for a long registration form.","nav(\'newOtp\')");return}
if(s==="newOtp"){top("OTP verify");st.innerHTML=hero("OTP verify","Verify mobile","One code keeps the journey moving.",img.people)+section("OTP","ACTION","Enter the code sent to the mobile number.")+cta("Verify OTP","Move directly to the Email ID step after successful verification.","nav(\'newEmail\')")+cta("Resend OTP","Recover quickly if the first code expires.","toast(\'OTP resent\')",false);return}
if(s==="newEmail"){top("Email ID");st.innerHTML=hero("Email ID","Add your email.","Email becomes part of your digital identity and recovery path.",img.life)+section("Email ID","ACTION","Add the email address you want connected to the account.")+cta("Send Email OTP","Confirm the digital identity without adding another long form.","nav(\'newEmailOtp\')");return}
if(s==="newEmailOtp"){top("OTP Verify");st.innerHTML=hero("OTP Verify","Verify email","One last check before your first Gold moment.",img.people)+section("OTP","ACTION","Enter the code sent to the email.")+cta("Verify Email","Complete the new-user verification path.","celebrate();nav(\'newGold\')");return}
if(s==="newGold"){top("Congratulations",false);celebrate();st.innerHTML='<div class="goldHero"><div class="coin">Au</div></div>'+hero("Congratulations","1 mg Gold credited","Earn more · Save More. Your first digital Gold is already yours.",img.gold)+cta("Build my Value Vault","Bring memberships, reward points, promocodes and vouchers into one visible layer.","nav(\'vault\')");return}
if(s==="vault"){top("Build my Value Vault");st.innerHTML=hero("2a","My Value Vault","Memberships, Reward Points, Promocodes and Vouchers/Coupons are the four visible value layers.",img.money)+'<div class="rail">'+[['My Memberships','Show status & edit'],['My Reward Points','Show status & edit'],['My Promocodes','Show status & edit'],['My Vouchers, coupons','Show status & edit']].map(a=>'<div class="glass tile"><strong>'+a[0]+'</strong><span>'+a[1]+' → permission can be requested</span><b>VALUE</b></div>').join("")+'</div>'+section("Share Value Vault","REDEEM","Redeem Free Gift Y/N · Redeem Points Y/N · Redeem Coupons Y/N.")+'<div class="grid3">'+choice("Free Gift","Redeem Y/N","✦","S.redeemGift=!S.redeemGift;toast(\'Free Gift: \'+(S.redeemGift?\'Y\':\'N\'))")+choice("Points","Redeem Y/N","P","S.redeemPoints=!S.redeemPoints;toast(\'Points: \'+(S.redeemPoints?\'Y\':\'N\'))")+choice("Coupons","Redeem Y/N","%","S.redeemCoupons=!S.redeemCoupons;toast(\'Coupons: \'+(S.redeemCoupons?\'Y\':\'N\'))")+'</div>'+section("Connect value","ACTION","List → approve/link apps by choosing the options 1-1. Icons remain faded for areas not connected.")+'<div class="grid2">'+choice("Apps / programmes","Request permission for email, SMS, apps and dropdowns.","A","nav(\'vaultEdit\')")+choice("Dynamic QR code","Store the QR or redirect to open the app.","⌁","nav(\'vaultQr\')")+'</div>';return}
if(s==="vaultEdit"){top("Value Vault permission");st.innerHTML=hero("User approval","Approve one programme at a time.","User approves credentials, validity upto date, % discount or value available.",img.work)+section("Programme","SELECTED","Membership / Reward / Promocode / Voucher") + section("Saved","ENCRYPTED","Approved programme-wise value or % discount is saved with history, validity and credentials in encrypted format.")+cta("Approve & update Value Vault","Keep control of each connection and make the approved value reusable.","celebrate();nav(\'cockpit\')");return}
