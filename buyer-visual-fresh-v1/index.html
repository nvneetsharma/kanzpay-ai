<style>

.rail{display:flex;gap:8px;overflow:auto;padding:2px 1px 7px;margin-top:8px}.rail::-webkit-scrollbar{display:none}.rail>*{flex:0 0 auto}.tile{width:148px;padding:11px;text-align:left}.tile strong{display:block;font-size:11px}.tile span{display:block;color:var(--muted);font-size:8px;line-height:1.35;margin-top:3px}.tile b{display:block;color:var(--gold2);font-size:9px;margin-top:10px}

.gold{height:158px;border-radius:26px;position:relative;overflow:hidden;border:1px solid var(--line);background:radial-gradient(circle at 50% 50%,rgba(242,215,137,.17),rgba(5,7,5,.88) 58%)}.coin{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);width:86px;height:86px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 30% 25%,#fff2bd,#f0d376 20%,#aa7922 58%,#43300c);color:#533908;font-weight:950;font-size:22px;box-shadow:0 0 48px rgba(242,215,137,.34);animation:spin 7s linear infinite}.goldValue{position:absolute;left:15px;bottom:12px}.goldValue strong{display:block;font-size:24px}.goldValue span{font-size:8px;color:var(--muted)}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}.check{padding:10px;text-align:left}.check b{font-size:14px;color:var(--gold2)}.check span{display:block;font-size:8px;color:var(--muted);margin-top:3px}

.instrument{width:178px;padding:11px;min-height:103px;text-align:left}.instrument strong{display:block;font-size:12px;margin-top:13px}.instrument span{display:block;color:var(--muted);font-size:8px;margin-top:3px}.instrument b{display:block;color:var(--gold2);font-size:8px;margin-top:9px}
.id{height:135px;position:relative;border-radius:16px;background:linear-gradient(145deg,#e7dfcb,#969078);overflow:hidden}.id:before{content:"";position:absolute;left:13px;top:16px;width:50px;height:64px;border-radius:9px;background:linear-gradient(145deg,#d8ac8f,#6e4938)}.idLines{position:absolute;left:76px;right:12px;top:18px}.idLines i{display:block;height:6px;border-radius:5px;background:rgba(57,52,39,.22);margin-bottom:7px}.cam{height:155px;border-radius:24px;position:relative;overflow:hidden;border:1px solid var(--line);background:#111811;display:grid;place-items:center}.cam img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.45}.cam:after{content:"";position:absolute;inset:18px;border:1px solid rgba(242,215,137,.5);border-radius:18px}.dot{position:absolute;width:9px;height:9px;border-radius:50%;background:var(--gold2);box-shadow:0 0 16px rgba(242,215,137,.8);z-index:2;animation:pulse 2.1s ease-in-out infinite}
.assistant{position:absolute;left:14px;right:14px;bottom:17px;display:flex;justify-content:flex-end;gap:8px;align-items:flex-end;z-index:30;pointer-events:none}.bubble{max-width:280px;padding:10px 12px;border-radius:17px;background:rgba(14,17,14,.93);border:1px solid var(--line);box-shadow:0 18px 50px rgba(0,0,0,.44);backdrop-filter:blur(20px)}.bubble small{display:block;font-size:7px;letter-spacing:.15em;color:var(--gold2)}.bubble strong{display:block;font-size:11px;margin-top:3px}.bubble span{display:block;font-size:8px;color:var(--muted);line-height:1.35;margin-top:2px}.face{pointer-events:auto;width:49px;height:49px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 25%,#f9e6a2,#a87823 42%,#49330c);border:1px solid rgba(242,215,137,.44);color:#3d2a08;font-weight:950;box-shadow:0 0 35px rgba(242,215,137,.2)}
.confetti{position:fixed;inset:0;z-index:90;pointer-events:none}.piece{position:absolute;width:8px;height:15px;border-radius:2px;animation:fall 1.8s cubic-bezier(.2,.8,.2,1) forwards}
.toast{position:fixed;left:50%;bottom:74px;transform:translate(-50%,10px);opacity:0;z-index:80;padding:9px 12px;border:1px solid var(--line);border-radius:11px;background:rgba(14,17,14,.95);color:var(--gold2);font-size:9px;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
@keyframes in{from{opacity:0;transform:translateY(8px) scale(.99)}to{opacity:1;transform:none}}@keyframes pulse{0%,100%{opacity:.35;transform:scale(.95)}50%{opacity:.9;transform:scale(1.02)}}@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}@keyframes sheen{0%,60%{transform:translateX(-65%) rotate(7deg)}85%,100%{transform:translateX(60%) rotate(7deg)}}@keyframes fall{from{transform:translate3d(0,-10vh,0) rotate(0);opacity:1}to{transform:translate3d(var(--x),110vh,0) rotate(680deg);opacity:0}}
@media(max-height:720px){.hero{min-height:160px}.node{min-height:94px}.gold{height:145px}.card{min-height:165px}}
.flowMark{display:flex;align-items:center;gap:8px;margin:0 0 9px;padding:6px 8px;border:1px solid rgba(242,215,137,.13);border-radius:12px;background:rgba(242,215,137,.025)}.flowMark b{font-size:8px;color:#171308;background:linear-gradient(135deg,#f7e29b,#bb8e27);padding:4px 7px;border-radius:8px}.flowMark span{font-size:7px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}.flowMark em{margin-left:auto;font-size:7px;font-style:normal;color:var(--gold2);letter-spacing:.1em}</style></head>
<body><div id="app"><div class="shell"><div class="top" id="top"></div><div class="stage" id="stage"></div><div class="assistant"><div class="bubble"><small>K-ASSISTANT</small><strong id="at"></strong><span id="ab"></span></div><button class="face" onclick="toast('K-Assistant is here')">K</button></div><div class="toast" id="toast"></div><div class="confetti" id="confetti"></div></div></div>
<script>
const S={step:"home",history:[],entry:"tap",existing:false,invoice:false,vaultOk:false,redeem:{gift:false,points:false,coupons:false},profile:"Personal",share:"Tap / Share Card",template:"Executive",period:"Monthly",pay:"ADCB A2A"};
const IMG={life:"https://images.unsplash.com/photo-1529156069898-49953e39b3ac?auto=format&fit=crop&w=1000&q=84",store:"https://images.unsplash.com/photo-1472851294608-062f824d29cc?auto=format&fit=crop&w=1000&q=84",people:"https://images.unsplash.com/photo-1521737711867-e3b97375b3ac?auto=format&fit=crop&w=1000&q=84",card:"https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=900&q=84",gold:"https://images.unsplash.com/photo-1610375461246-83df859d849d?auto=format&fit=crop&w=1000&q=84",money:"https://images.unsplash.com/photo-1554224155-8d04cb21cd6c?auto=format&fit=crop&w=1000&q=84",pay:"https://images.unsplash.com/photo-1556742049-0cfed4f6a45d?auto=format&fit=crop&w=1000&q=84",id:"https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=900&q=84"};
const M={home:["I’m here with you.","The supplied flow starts with one simple tap or scan."],start:["Connection received.","Tap opens the URL popup. Scan opens the camera URL link."],web:["Web App Started.","Now we go exactly to Check User."],check:["One branch at a time.","Existing User goes to Invoice Shared. New User goes to Mobile No."],newMobile:["New user begins here.","Mobile → OTP → Email → OTP → 1 mg Gold."],newOtp:["One code.","Verify the mobile number, then email."],newEmail:["Now email.","One code keeps the new-user journey moving."],newEmailOtp:["Almost there.","Verify email and the 1 mg Gold congratulations follows."],goldNew:["Mabrook.","Congratulations + 1 mg Gold credited. Build my Value Vault."],vault:["Your Value Vault.","Four visible value groups, then permission and Dynamic QR decisions."],vaultPerm:["Approval stays yours.","User-approved credentials, validity and % discount/value are stored encrypted."],vaultQr:["One QR decision.","No = store QR in Vault. Yes = save app redirection."],invoice:["Existing user path.","Invoice Shared decides the gamified engine."],game:["The invoice returned value.","My Expenses, My Rewards and My Gold Vault are updated."],vaultDecision:["Value Vault OK?","Yes opens the stored value. No opens Navigation / Seller Offers / Live Catalogue."],navigate:["Three store actions.","Navigation, Seller Offers, Live Order Catalogue."],cockpit:["This is your Cockpit.","The six exact modules from the supplied diagram are here."],vaultMod:["Value Vault module.","Status / edit, permission, connected icons and Dynamic QR remain explicit."],card:["Visiting Card.","First My Card Available? Then Tap/Share or Add/Configure, My Profiles and templates."],friends:["Earn with Friends.","First explain the benefit, then share to a friend’s mobile."],gold:["My Gold Vault.","Weight +/-% vs purchase, value and six exact actions."],expenses:["My Expenses.","Category-wise, then daily/weekly/monthly/yearly progression with bar and pie charts."],payment:["Payment Instrument Intelligence.","Cards + bank accounts, connected/unconnected, offers/benefits, approval."],status:["All Set to Earn More.","Step 3 + Step 4 status leads to Create Account."],create:["Step 4 Create Account.","Front, back, live camera, crop/edit, photo match and AML."]};
const flowNames={home:["1","TAP / SCAN","ACTION"],tapAction:["1a","CLICK URL SCREEN POPUP","ACTION"],scanAction:["1b","CLICK CAMERA URL LINK","ACTION"],web:["RESULT","WEB APP STARTED","RESULT"],check:["2","CHECK USER","DECISION"],newMobile:["NO","MOBILE NO","ACTION"],newOtp:["NO","OTP VERIFY","ACTION"],newEmail:["NO","EMAIL ID","ACTION"],newEmailOtp:["NO","OTP VERIFY","ACTION"],goldNew:["RESULT","1 MG GOLD CREDITED","RESULT"],vault:["2a","SHARE VALUE VAULT","ACTION"],vaultPerm:["2a","USER APPROVAL","ACTION"],vaultQr:["2a","DYNAMIC QR CODE","DECISION"],vaultUpdated:["RESULT","UPDATED IN VALUE VAULT","RESULT"],invoice:["2","INVOICE SHARED","DECISION"],game:["YES","GAMIFIED ENGINE RUNS","RESULT"],vaultDecision:["NO","VALUE VAULT OK?","DECISION"],navigate:["NO","NAVIGATION / SELLER OFFERS / LIVE ORDER CATALOGUE","ACTION"],cockpit:["3","COCKPIT","MODULES"],vaultMod:["3a","MY VALUE VAULT","MODULE"],card:["3b","MY VISITING CARD","MODULE"],cardShare:["3b","TAP / SHARE CARD","ACTION"],cardConfigure:["3b","ADD OR CONFIGURE CARD","ACTION"],cardProfiles:["3b","MY PROFILES","ACTION"],cardTemplate:["3b","CHOOSE TEMPLATE","ACTION"],cardEdit:["3b","EDIT PROFILE INFORMATION","ACTION"],friends:["3c","EARN WITH FRIENDS","MODULE"],gold:["3d","MY GOLD VAULT","MODULE"],expenses:["3e","MY EXPENSES","MODULE"],payment:["3f","PAYMENT INSTRUMENT INTELLIGENCE","MODULE"],status:["3+4","VALUE & WEALTH BUILDING STATUS","RESULT"],create:["4","CREATE ACCOUNT","ACTION"],idFront:["4","EMIRATES ID FRONT","ACTION"],idBack:["4","EMIRATES ID BACK","ACTION"],live:["4","LIVE CAMERA","ACTION"],docReview:["4","DOCUMENT CROP / EDIT · PHOTO MATCH · AML","ACTION"],final:["RESULT","ACCOUNT READY","RESULT"]};
function flowMark(){const f=flowNames[S.step]||["","", ""];return '<div class="flowMark"><b>'+f[0]+'</b><span>'+f[1]+'</span><em>'+f[2]+'</em></div>}
function top(label){document.getElementById("top").innerHTML=(label?'<button style="font-size:8px;color:var(--muted)" onclick="back()">‹ '+label+'</button>':'<div class="brand">K<span>ANZPAY</span></div>')+'<span class="tiny">BUYER · EXACT FLOW</span>'}
function hero(e,t,c,p){return '<div class="hero"><img src="'+p+'"><div class="heroCopy"><div class="eyebrow">'+e+'</div><h1>'+t+'</h1><p>'+c+'</p></div></div>'}
function sec(t,s,c){return '<div class="glass section"><div class="metric"><strong>'+t+'</strong><span class="tiny">'+s+'</span></div><div class="sub">'+c+'</div></div>'}
function card(t,sub,icon,fn){return '<button class="glass node" onclick="'+fn+'"><div class="ico">'+icon+'</div><strong>'+t+'</strong><span>'+sub+'</span></button>'}
function cta(t,b,fn,primary=true){return '<div class="ctaWrap"><button class="cta '+(primary?'primary':'')+'" onclick="'+fn+'"><b>'+t+'</b><small>Benefit: '+b+'</small></button></div>'}
function toast(t){const x=document.getElementById("toast");x.textContent=t;x.classList.add("show");clearTimeout(window.tt);window.tt=setTimeout(()=>x.classList.remove("show"),1500)}
function confetti(){const box=document.getElementById("confetti");box.innerHTML="";for(let i=0;i<70;i++){const d=document.createElement("i");d.className="piece";d.style.left=(44+Math.random()*12)+"%";d.style.setProperty("--x",((Math.random()-.5)*85)+"vw");d.style.background=["#f2d789","#fff0b5","#9fc8a7","#d2a43b","#fff"][i%5];d.style.animationDelay=(Math.random()*.24)+"s";box.appendChild(d)}setTimeout(()=>box.innerHTML="",2200)}
function nav(n){if(n!==S.step)S.history.push(S.step);S.step=n;render()}function back(){S.step=S.history.pop()||"home";render()}
function setA(){const m=M[S.step]||M.home;document.getElementById("at").textContent=m[0];document.getElementById("ab").textContent=m[1]}
function render(){setA();const s=S.step,st=document.getElementById("stage");
if(s==="home"){top("");st.innerHTML=flowMark()+hero("BUYER FLOW","@Phone: Tap or Scan to start the journey.","Two explicit entry routes, exactly as in the supplied flow.",IMG.life)+'<div class="grid2">'+card("Tap","Click URL Screen Popup","◉","nav(\'tapAction\')")+card("Scan","Click Camera URL Link","⌁","nav(\'scanAction\')")+'</div>';return}
if(s==="tapAction"){top("Tap");st.innerHTML=flowMark()+hero("1a · ACTION","Click URL Screen Popup","Tap opens the store URL popup. Confirm the URL to reach Web App Started.",IMG.store)+'<div class="glass section" style="padding:14px"><div class="tiny">URL POPUP</div><div style="margin-top:8px;font-size:12px;color:var(--gold2)">https://kanzpay.com/store/grand-gifts</div><div class="sub">Secure store link recognised from the tap.</div></div>'+cta("Web App Started","Benefit: open the connected store journey without manual search.","nav(\'web\')");return}
if(s==="scanAction"){top("Scan");st.innerHTML=flowMark()+hero("1b · ACTION","Click Camera URL Link","Scan the store URL, confirm it and continue to Web App Started.",IMG.store)+'<div class="glass section" style="height:125px;display:grid;place-items:center"><div style="width:180px;height:90px;border:1px solid rgba(242,215,137,.5);border-radius:18px;display:grid;place-items:center;color:var(--gold2);font-size:28px">⌁</div></div>'+cta("Web App Started","Benefit: turn the scanned URL into the connected store journey.","nav(\'web\')");return}
if(s==="web"){top("Web App Started");st.innerHTML=flowMark()+hero("RESULT","Web App Started","The flow now moves to Check User exactly as supplied.",IMG.people)+cta("Check User","Choose Existing User or New User without leaving the supplied journey.","nav(\'check\')");return}
if(s==="check"){top("Check User");st.innerHTML=flowMark()+hero("STEP 2","Check User","Existing User → Invoice Shared. New User → Mobile No.",IMG.people)+'<div class="grid2">'+card("Existing User","Yes → Invoice Shared","✓","S.existing=true;nav(\'invoice\')")+card("New User","No → Mobile No","＋","S.existing=false;nav(\'newMobile\')")+'</div>';return}
if(s==="newMobile"){top("New User");st.innerHTML=flowMark()+hero("NEW USER","Mobile No","The new-user branch starts with mobile number.",IMG.pay)+cta("OTP verify","Benefit: verify the mobile identity with one step.","nav(\'newOtp\')");return}
if(s==="newOtp"){top("OTP verify");st.innerHTML=flowMark()+hero("NEW USER","OTP verify","Verify mobile OTP, then continue to Email ID.",IMG.people)+sec("Mobile verified","RESULT","Mobile number is verified.") + cta("Email ID","Benefit: continue directly to the email verification step.","nav(\'newEmail\')");return}
if(s==="newEmail"){top("Email ID");st.innerHTML=flowMark()+hero("NEW USER","Email ID","Add the email identity shown in the flow.",IMG.life)+cta("OTP Verify","Benefit: complete the email identity with one verification.","nav(\'newEmailOtp\')");return}
if(s==="newEmailOtp"){top("OTP Verify");st.innerHTML=flowMark()+hero("NEW USER","OTP Verify","Verify the email code.",IMG.people)+cta("Congratulations","Benefit: unlock the first 1 mg Gold credit and start the Value Vault.","confetti();nav(\'goldNew\')");return}
