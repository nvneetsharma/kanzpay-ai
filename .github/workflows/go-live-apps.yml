name: KANZPAY Go-Live Builds
on:
  push:
    branches: [go-live-buyer-seller-apps]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  android-buyer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Copy buyer web app into Android assets
        run: |
          mkdir -p go-live/android/app/src/main/assets
          cp go-live/buyer/index.html go-live/android/app/src/main/assets/index.html
          cp go-live/buyer/manifest.json go-live/android/app/src/main/assets/manifest.json
      - name: Build APK
        working-directory: go-live/android
        run: gradle assembleDebug
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: kanzpay-buyer-android
          path: go-live/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  seller-desktop:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: seller-linux
          - os: windows-latest
            artifact: seller-windows
          - os: macos-latest
            artifact: seller-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: 'npm', cache-dependency-path: go-live/seller/package.json}
      - name: Install dependencies
        working-directory: go-live/seller
        run: npm install
      - name: Build desktop app
        working-directory: go-live/seller
        run: npm run dist
      - name: Upload seller installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: go-live/seller/dist/**
          retention-days: 30

