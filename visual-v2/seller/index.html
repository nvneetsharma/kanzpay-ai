<!doctype html>
<html>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KANZPAY K-Assistant — Seller</title>
<style>
:root{--bg:#070707;--surface:#111310;--surface2:#171a15;--gold:#d8b34c;--goldHi:#f2d98a;--ink:#f2efe6;--muted:#aaa79d;--line:rgba(242,217,138,.18);--good:#83bd90;--warn:#d6ad63;--bad:#d88876}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:14px Inter,system-ui,sans-serif}body{overflow-x:hidden}.shell{max-width:1360px;margin:auto;padding:20px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px}.logo{font-weight:900;letter-spacing:.18em;font-size:14px}.logo b{color:var(--goldHi)}.sys{font-size:11px;color:var(--muted)}.nav{display:flex;gap:8px;overflow:auto;padding:16px 0}.nav button{white-space:nowrap}.btn{background:#10120f;border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:10px 13px;min-height:42px;cursor:pointer}.btn.primary{background:var(--gold);color:#17140c;border-color:var(--gold);font-weight:800}.btn.good{border-color:rgba(131,189,144,.3);color:var(--good)}.layout{display:grid;grid-template-columns:1.25fr .75fr;gap:15px}.card{background:rgba(18,20,17,.88);border:1px solid rgba(242,217,138,.12);border-radius:20px;padding:18px;box-shadow:0 20px 65px rgba(0,0,0,.34);backdrop-filter:blur(18px)}.card.shine{position:relative;overflow:hidden}.card.shine:after{content:"";position:absolute;top:-30%;right:-40%;width:3px;height:160%;background:rgba(242,217,138,.4);filter:blur(6px);transform:rotate(14deg);animation:shine 5s ease-in-out infinite}.k{font-size:10px;text-transform:uppercase;letter-spacing:.16em;color:var(--goldHi)}h1{font-size:40px;letter-spacing:-.035em;margin:7px 0}h2{font-size:23px;margin:4px 0 11px}h3{font-size:17px;margin:0 0 6px}.muted{color:var(--muted);line-height:1.5}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.metric{min-height:140px}.n{font-size:31px;color:var(--goldHi);font-weight:900;margin-top:18px}.sub{font-size:11px;color:var(--muted)}.list{display:grid;gap:9px}.item{background:#0e100e;border:1px solid rgba(255,255,255,.07);border-radius:13px;padding:12px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.pill{border:1px solid rgba(242,217,138,.16);background:#15160f;color:var(--goldHi);padding:5px 8px;border-radius:999px;font-size:10px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.tag{padding:3px 6px;border-radius:5px;background:var(--goldHi);color:#111;font-size:9px;font-weight:800}.floating{position:fixed;right:23px;bottom:23px;width:76px;height:76px;border-radius:50%;display:grid;place-items:center;background:#0c0d0b;border:1px solid var(--gold);color:var(--goldHi);font-weight:900;box-shadow:0 0 34px rgba(216,179,76,.16),0 15px 45px rgba(0,0,0,.45);cursor:pointer;z-index:20;animation:breathe 4s ease-in-out infinite}.sectionTitle{display:flex;justify-content:space-between;align-items:flex-end;margin:6px 0 12px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.74);display:grid;place-items:center;padding:20px;z-index:50}.modal.hidden{display:none}.modalBox{max-width:720px;width:100%;max-height:88vh;overflow:auto}.status{display:inline-flex;gap:6px;align-items:center}.dot{width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 12px rgba(131,189,144,.4)}.warn{background:var(--warn)}.bad{background:var(--bad)}.input{width:100%;background:#0b0d0b;color:var(--ink);border:1px solid rgba(255,255,255,.09);border-radius:11px;padding:11px;outline:none}.input:focus{border-color:var(--gold)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.chart{display:flex;align-items:end;gap:7px;height:130px}.bar{flex:1;background:#6d5725;border:1px solid rgba(242,217,138,.12);border-radius:8px 8px 2px 2px}.check{display:grid;grid-template-columns:22px 1fr auto;gap:9px;align-items:center;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.06)}.checkbox{width:19px;height:19px;border-radius:5px;border:1px solid var(--line);display:grid;place-items:center}.checkbox.on{background:var(--goldHi);color:#111;border-color:var(--goldHi)}@keyframes breathe{50%{transform:scale(1.035);box-shadow:0 0 48px rgba(216,179,76,.23),0 15px 45px rgba(0,0,0,.45)}}@keyframes shine{0%,55%{right:-40%}78%,100%{right:135%}}@media(max-width:980px){.layout{grid-template-columns:1fr}.metrics{grid-template-columns:1fr 1fr}}@media(max-width:650px){.shell{padding:14px}.metrics{grid-template-columns:1fr}.floating{right:14px;bottom:14px}}
</style>
</head>
<body>
<div class="shell">
<header class="top"><div class="logo">KANZ<span>PAY</span> <b>K-ASSISTANT</b></div><div class="sys" id="sys">Identifying system…</div></header>
<nav class="nav" id="nav"></nav>
<main id="app"></main>
</div>
<button class="floating" onclick="dashboard()">K</button>
<div id="modal" class="modal hidden"><div class="modalBox card" id="modalBox"></div></div>
<script>
const S=JSON.parse(localStorage.getItem("ka-v2")||"null")||{
onboarded:true,system:"browser review",business:"Restaurant",invoice:"In-Process",
orders:[{id:"#KZ-4001",customer:"Demo Buyer",total:68,status:"Pending"},{id:"#KZ-3998",customer:"Maya",total:124,status:"In-Process"},{id:"#KZ-3991",customer:"Omar",total:92,status:"Completed"}],
catalogue:[{sku:"SKU-001",name:"Chicken Bowl",price:28,stock:18},{sku:"SKU-002",name:"Latte",price:16,stock:6},{sku:"SKU-003",name:"Pasta",price:34,stock:42}],
tickets:{complaints:1,queries:3,ratings:42},rewards:{billRatio:"2.0%",pointsRatio:"10:1",goldRatio:"1.5%"},finance:{payables:12400,receivables:18400,pnl:6200,balance:52000},instruments:[{name:"Cards",connected:true},{name:"Account to Account",connected:true},{name:"Settlement",connected:false}]
};
const $=s=>document.querySelector(s);const save=()=>localStorage.setItem("ka-v2",JSON.stringify(S));
function nav(active){$("#nav").innerHTML=[["dashboard","Dashboard"],["orders","Orders"],["catalogue","Catalogue"],["inventory","Inventory"],["finance","Finance"],["profile","Profile Settings"]].map(x=>`<button class="btn ${x[0]===active?"primary":""}" onclick="${x[0]}()">${x[1]}</button>`).join("")}
function dashboard(){nav("dashboard");$("#app").innerHTML=`<section class="card shine"><div class="row"><div><div class="k">STEP 4 · DASHBOARD TRIGGER FROM K-ASSIST LOGO</div><h1>Seller Cockpit</h1><p class="muted">The floating K-Assistant logo remains available while the seller works. All-store selection, focus and intelligence stay in one living workspace.</p></div><span class="tag">ALL STORES</span></div><div class="actions"><button class="btn primary" onclick="invoicePopup()">View Invoice Status</button><button class="btn" onclick="onboarding()">Start / Edit Onboarding</button></div></section><section class="metrics" style="margin-top:14px"><div class="card metric"><div class="k">FOCUS · ORDERS</div><div class="n">${S.orders.filter(x=>x.status!=="Completed").length}</div><div class="sub">Pending + in-process</div></div><div class="card metric"><div class="k">CATALOGUE</div><div class="n">${S.catalogue.length}</div><div class="sub">Live SKUs</div></div><div class="card metric"><div class="k">CUSTOMERS</div><div class="n">${S.tickets.ratings}</div><div class="sub">Customer interactions</div></div></section><div class="layout" style="margin-top:14px"><section class="card"><div class="sectionTitle"><div><div class="k">FOCUS</div><h2>Orders & Tickets</h2></div><button class="btn" onclick="orders()">Open</button></div><div class="list">${S.orders.map(o=>`<div class="item row"><div><b>${o.id}</b><div class="sub">${o.customer} · AED ${o.total}</div></div><span class="pill">${o.status}</span></div>`).join("")}<div class="item row"><div><b>Tickets</b><div class="sub">Complaints · Queries · Ratings</div></div><span class="pill">${S.tickets.complaints} / ${S.tickets.queries} / ${S.tickets.ratings}</span></div></div></section><section class="card"><div class="sectionTitle"><div><div class="k">INTELLIGENCE</div><h2>Commercial signals</h2></div><span class="pill">AI demo data</span></div><div class="list"><div class="item"><b>Low stock</b><div class="sub">${S.catalogue.filter(x=>x.stock<10).length} SKUs need attention</div></div><div class="item"><b>Rewards</b><div class="sub">Bill value-point ratio ${S.rewards.billRatio} · Points-discount ${S.rewards.pointsRatio}</div></div><div class="item"><b>Customer trend</b><div class="sub">Repeat and order history available</div></div></div></section></div>`}
function invoicePopup(){open(`<div class="k">STEP 3 · VIEW STATUS OF INVOICE TRIGGER FROM K-ASSIST LOGO</div><h2>Invoice status</h2><div class="list"><div class="item row"><div><b>Paid</b><div class="sub">Mabrook · buyer payment completed</div></div><span class="pill">Completed</span></div><div class="item row"><div><b>Rejected</b><div class="sub">Ask buyer — reason</div></div><span class="pill">Needs input</span></div><div class="item row"><div><b>In-Process</b><div class="sub">Check if buyer needs help</div></div><span class="pill">Live</span></div><div class="item row"><div><b>Pending</b><div class="sub">Awaiting buyer action</div></div><span class="pill">Waiting</span></div></div><div class="actions"><button class="btn primary" onclick="invoiceAction('Paid')">Mark paid</button><button class="btn" onclick="invoiceAction('Rejected')">Reject</button><button class="btn" onclick="closeModal()">Close</button></div>`)}
function invoiceAction(status){S.invoice=status;save();closeModal();toast("Invoice "+status+" state updated");dashboard()}
function orders(){nav("orders");$("#app").innerHTML=`<section class="card"><div class="k">ORDERS</div><h1>Orders</h1><p class="muted">Pending orders · In-process orders · Order history · Tickets · Rewards.</p><div class="list" style="margin-top:14px">${S.orders.map((o,i)=>`<div class="item"><div class="row"><div><b>${o.id}</b><div class="sub">${o.customer} · AED ${o.total}</div></div><span class="pill">${o.status}</span></div><div class="actions"><button class="btn" onclick="nextOrder(${i})">Advance status</button><button class="btn" onclick="open('<div class=k>ORDER</div><h2>${o.id}</h2><p class=muted>Demo item list, buyer context and commerce completion.</p><button class=btn onclick=closeModal()>Done</button>')">Open</button></div></div>`).join("")}</div><div class="card" style="margin-top:12px"><div class="row"><div><div class="k">REWARDS</div><h3>Merchant-funded value signals</h3></div><span class="pill">Bill Value · Points · Gold</span></div><p class="muted">Bill Value-Points ratio: ${S.rewards.billRatio} · Points-Discount ratio: ${S.rewards.pointsRatio} · Gold = ${S.rewards.goldRatio} of Bill Value.</p></div></section>`}
function nextOrder(i){const seq=["Pending","In-Process","Completed"];const n=seq.indexOf(S.orders[i].status);S.orders[i].status=seq[Math.min(n+1,2)];save();orders();toast("Order status updated")}
function catalogue(){nav("catalogue");$("#app").innerHTML=`<section class="card"><div class="row"><div><div class="k">CATALOGUE</div><h1>K-ACE Catalogue</h1><p class="muted">Editable menu page · competitive price SKU · menu templates · inventory ledger.</p></div><button class="btn primary" onclick="addSku()">Add SKU</button></div><div class="list" style="margin-top:14px">${S.catalogue.map((x,i)=>`<div class="item"><div class="row"><div><b>${x.name}</b><div class="sub">${x.sku} · AED ${x.price}</div></div><span class="pill">${x.stock} in stock</span></div><div class="actions"><button class="btn" onclick="editSku(${i})">Edit</button><button class="btn" onclick="changeStock(${i},-1)">− Stock</button><button class="btn" onclick="changeStock(${i},1)">+ Stock</button></div></div>`).join("")}</div><div class="card" style="margin-top:12px"><div class="k">UPLOAD INVENTORY</div><h3>Build catalogue from products</h3><p class="muted">Demo flow: select source → upload inventory → extract SKU, price and stock → create editable menu.</p><button class="btn primary" onclick="uploadInventory()">Upload inventory</button></div></section>`}
function addSku(){S.catalogue.push({sku:"SKU-"+String(S.catalogue.length+1).padStart(3,"0"),name:"Demo Product "+(S.catalogue.length+1),price:20,stock:25});save();catalogue()}
function editSku(i){open(`<div class="k">EDITABLE MENU PAGE</div><h2>Edit ${esc(S.catalogue[i].name)}</h2><div class=grid2><input id=sn class=input value="${esc(S.catalogue[i].name)}"><input id=sp class=input type=number value="${S.catalogue[i].price}"></div><div class=actions><button class="btn primary" onclick="S.catalogue[${i}].name=$('#sn').value;S.catalogue[${i}].price=+$('#sp').value;save();closeModal();catalogue()">Save</button><button class=btn onclick=closeModal()>Cancel</button></div>`)}
function changeStock(i,d){S.catalogue[i].stock=Math.max(0,S.catalogue[i].stock+d);save();catalogue()}
function uploadInventory(){toast("Inventory upload processed · catalogue updated")}
function inventory(){nav("inventory");$("#app").innerHTML=`<section class="card"><div class="k">INVENTORY</div><h1>Stock intelligence</h1><div class="metrics" style="margin-top:14px"><div class="card metric"><div class="k">LOW STOCK</div><div class="n">${S.catalogue.filter(x=>x.stock<10).length}</div><div class="sub">SKU list −/+</div></div><div class="card metric"><div class="k">HIGH STOCK</div><div class="n">${S.catalogue.filter(x=>x.stock>30).length}</div><div class="sub">SKU list −/+</div></div><div class="card metric"><div class="k">TOTAL UNITS</div><div class="n">${S.catalogue.reduce((a,x)=>a+x.stock,0)}</div><div class="sub">Live ledger</div></div></div><div class="actions"><button class="btn primary" onclick="catalogue()">Open Catalogue</button></div></section>`}
function finance(){nav("finance");$("#app").innerHTML=`<section class="card"><div class="k">FINANCE</div><h1>Finance & payment instruments</h1><div class="metrics" style="margin-top:14px"><div class="card metric"><div class="k">PAYABLES</div><div class="n">AED ${S.finance.payables.toLocaleString()}</div><div class="sub">Payables value</div></div><div class="card metric"><div class="k">RECEIVABLES</div><div class="n">AED ${S.finance.receivables.toLocaleString()}</div><div class="sub">Receivables V/V/I</div></div><div class="card metric"><div class="k">P&L</div><div class="n">AED ${S.finance.pnl.toLocaleString()}</div><div class="sub">Demo ledger</div></div></div><div class="layout" style="margin-top:14px"><div class="card"><div class="k">BALANCE SHEET</div><h2>AED ${S.finance.balance.toLocaleString()}</h2><div class="chart"><div class=bar style="height:48%></div><div class=bar style="height:67%"></div><div class=bar style="height:82%"></div><div class=bar style="height:61%"></div><div class=bar style="height:90%"></div></div><div class="sub">Transaction cycle: day / week / month / year</div></div><div class="card"><div class="k">PAYMENT INSTRUMENTS</div><div class=list style="margin-top:8px">${S.instruments.map((x,i)=>`<div class=check><div class="checkbox ${x.connected?"on":""}" onclick="toggleInstrument(${i})">${x.connected?"✓":""}</div><div><b>${x.name}</b><div class=sub>${x.connected?"Connected":"Not connected"}</div></div><span class=pill>${x.connected?"Active":"Activate"}</span></div>`).join("")}</div><div class=actions><button class="btn primary" onclick="toast("Plan change options opened")">Change plan</button></div></div></div></section>`}
function toggleInstrument(i){S.instruments[i].connected=!S.instruments[i].connected;save();finance()}
function profile(){nav("profile");$("#app").innerHTML=`<section class="card"><div class="k">PROFILE SETTINGS</div><h1>K-Assistant Setup</h1><p class="muted">Business type · latitude/longitude · address · logo · Emirates ID · Commercial Licence · live camera.</p><div class="grid2" style="margin-top:14px"><div><div class=sub>Business type</div><input class=input id=business value="${esc(S.business)}"></div><div><div class=sub>Address</div><input class=input value="Demo Seller Address"></div></div><div class="card" style="margin-top:10px"><div class="k">IDENTITY CHECK</div><div class="check"><div class="checkbox on">✓</div><div><b>Emirates ID front + back</b><div class=sub>Crop · edit · photo match</div></div><span class=pill>Ready</span></div><div class="check"><div class="checkbox on">✓</div><div><b>Commercial Licence</b><div class=sub>Seller compliance input</div></div><span class=pill>Ready</span></div><div class="actions"><button class="btn" onclick="toast("Live camera instructions: blink · look left · look right · hold ID")">Live camera</button><button class="btn primary" onclick="S.business=$('#business').value;save();toast("Seller profile saved")">Save settings</button></div></div><div class="card shine" style="margin-top:10px"><div class="k">SYSTEM AGENT</div><h3>Install K-Assistant</h3><p class="muted">Identify Windows / Mac / Linux / Android → install drivers → align patch → create floating K-Assistant logo.</p><div class="actions"><button class="btn primary" onclick="installAgent()">Identify & install</button></div></div></section>`}
function onboarding(){profile()}
function installAgent(){open(`<div class=k>INSTALL K-ASSISTANT</div><h2>Identifying system…</h2><div class=item><div class=row><span>System</span><span class=pill>${esc(S.system)}</span></div><div class=row style="margin-top:8px"><span>Drivers</span><span class=pill>Ready</span></div><div class=row style="margin-top:8px"><span>Floating logo</span><span class=pill>Ready</span></div></div><div class=actions><button class="btn primary" onclick="closeModal();toast("K-Assistant floating logo is active")">Launch</button></div>`)}
function toast(t){open(`<div class=k>K-ASSISTANT</div><h2>${esc(t)}</h2><div class=actions><button class="btn primary" onclick=closeModal()>OK</button></div>`)}
function open(html){$("#modalBox").innerHTML=html;$("#modal").classList.remove("hidden")}
function closeModal(){$("#modal").classList.add("hidden")}
function esc(t){return String(t).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[m]))}
if(window.kassist)window.kassist.system().then(s=>{$("#sys").textContent="System: "+s.platform+" · "+s.arch+" · "+s.version;S.system=s.platform+" "+s.arch;save()}).catch(()=>{});
else $("#sys").textContent="Browser review · desktop agent architecture ready";
dashboard();
</script>
</body>
</html>
