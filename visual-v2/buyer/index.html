<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#070707">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KANZPAY">
<link rel="manifest" href="./manifest.json">
<title>KANZPAY — Buyer</title>
<style>
:root{--bg:#070707;--surface:#111310;--surface2:#181a16;--glass:rgba(24,27,22,.84);--line:rgba(242,217,138,.22);--gold:#d8b34c;--goldHi:#f2d98a;--goldDim:#a88737;--ink:#f3f0e7;--muted:#aaa79d;--good:#8fc39a;--danger:#df8d78;--shadow:0 24px 80px rgba(0,0,0,.48)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{overflow-x:hidden}
button,input{font:inherit}
button{color:inherit}
.app{min-height:100vh;display:flex;flex-direction:column}
.ambient{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.ambient .halo{position:absolute;width:58vmax;height:58vmax;border:1px solid rgba(216,179,76,.08);border-radius:50%;left:50%;top:15%;transform:translate(-50%,-50%);animation:orbit 20s linear infinite}
.ambient .halo2{position:absolute;width:38vmax;height:38vmax;border:1px solid rgba(242,217,138,.06);border-radius:50%;left:50%;top:15%;transform:translate(-50%,-50%);animation:orbit 14s linear infinite reverse}
.shell{position:relative;z-index:1;width:100%;max-width:720px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-weight:900;letter-spacing:.2em;font-size:13px}.logo b{color:var(--goldHi)}
.small{font-size:11px;color:var(--muted)}
.hero{min-height:calc(100vh - 120px);display:grid;place-items:center;text-align:center}
.hero-inner{width:min(440px,100%)}
.orb{width:188px;height:188px;margin:12px auto 24px;position:relative;border:1px solid rgba(216,179,76,.55);border-radius:50%;display:grid;place-items:center;background:#0c0d0b;box-shadow:0 0 90px rgba(216,179,76,.12),inset 0 0 46px rgba(216,179,76,.08);animation:breathe 4s ease-in-out infinite}
.orb:before,.orb:after{content:"";position:absolute;border-radius:50%;border:1px solid rgba(242,217,138,.11);inset:-16px;animation:pulse 3.8s ease-in-out infinite}
.orb:after{inset:-34px;opacity:.7;animation-delay:1s}
.orb span{font-size:11px;letter-spacing:.16em;color:var(--goldHi)}
h1{font-size:clamp(30px,8vw,46px);line-height:1.02;margin:0 0 12px;letter-spacing:-.035em}
h2{font-size:23px;line-height:1.1;margin:0 0 8px}h3{font-size:17px;margin:0 0 6px}
.kicker{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--goldHi)}
.p{color:var(--muted);line-height:1.55;font-size:14px;margin:0}
.actions{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin-top:18px}
.btn{border:1px solid var(--line);background:#0f110e;border-radius:14px;padding:12px 15px;min-height:46px;transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease}.btn:active{transform:scale(.98)}
.btn.primary{background:#d8b34c;color:#17150e;border-color:#d8b34c;font-weight:800;box-shadow:0 8px 30px rgba(216,179,76,.17)}
.btn.ghost{background:transparent}
.journey{position:sticky;top:0;z-index:5;padding:10px 0 12px;background:linear-gradient(rgba(7,7,7,.95),rgba(7,7,7,0));backdrop-filter:blur(8px)}
.rail{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;align-items:center}
.node{position:relative;text-align:center}.node:after{content:"";position:absolute;left:62%;right:-38%;top:14px;height:1px;background:rgba(242,217,138,.12)}.node:last-child:after{display:none}
.dot{width:29px;height:29px;border-radius:50%;margin:0 auto 5px;border:1px solid rgba(242,217,138,.22);display:grid;place-items:center;font-size:11px;color:var(--muted);background:#0d0e0c}.node.active .dot{background:var(--goldHi);border-color:var(--goldHi);color:#111;font-weight:800;box-shadow:0 0 22px rgba(242,217,138,.15)}.node.done .dot{background:#272719;border-color:var(--gold);color:var(--goldHi)}
.scene{min-height:calc(100vh - 156px);display:flex;flex-direction:column;justify-content:center;padding:12px 0 24px;animation:sceneIn .45s ease}
.scene.center{text-align:center;align-items:center}
.stack{display:grid;gap:12px}
.card{background:var(--glass);border:1px solid rgba(242,217,138,.14);border-radius:22px;padding:17px;box-shadow:var(--shadow);backdrop-filter:blur(18px);position:relative;overflow:hidden}
.card.shine:after{content:"";position:absolute;width:2px;height:130%;background:rgba(242,217,138,.42);filter:blur(5px);right:-16%;top:-15%;transform:rotate(16deg);animation:shimmer 4.8s ease-in-out infinite}
.card.actionable{border-color:rgba(242,217,138,.33);cursor:pointer;transition:transform .22s ease,border-color .22s ease,box-shadow .22s ease}.card.actionable:active{transform:translateY(2px) scale(.995)}.card.actionable:hover{border-color:rgba(242,217,138,.5)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.metric{font-size:30px;font-weight:900;color:var(--goldHi);letter-spacing:-.03em}.sub{font-size:11px;color:var(--muted)}
.pills{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.pill{padding:6px 9px;border:1px solid rgba(242,217,138,.15);border-radius:999px;font-size:11px;color:var(--goldHi);background:#13140f}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.divider{height:1px;background:rgba(255,255,255,.08);margin:14px 0}
.bento{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.bento .module{min-height:170px}.module strong{display:block;font-size:20px;margin-top:8px}.module .metric{margin-top:12px}
.module.wide{grid-column:1/-1;min-height:150px}
.iconCircle{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(242,217,138,.22);color:var(--goldHi);font-weight:900}
.statusDot{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 14px rgba(143,195,154,.4);display:inline-block}
.input{width:100%;margin-top:7px;background:#0b0d0b;border:1px solid rgba(255,255,255,.1);color:var(--ink);padding:12px 13px;border-radius:12px;outline:none}
.input:focus{border-color:rgba(242,217,138,.55)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.74);z-index:30;display:grid;place-items:end center;padding:12px}.modal.hidden{display:none}
.sheet{width:min(720px,100%);max-height:88vh;overflow:auto;background:#121411;border:1px solid rgba(242,217,138,.2);border-radius:24px 24px 16px 16px;padding:18px;box-shadow:0 -30px 100px rgba(0,0,0,.55);animation:sheetUp .3s ease}
.chart{display:flex;align-items:flex-end;gap:7px;height:130px;padding:12px 0}.bar{flex:1;border:1px solid rgba(242,217,138,.16);background:#6e5928;border-radius:8px 8px 3px 3px;min-height:12px}
.ticker{display:flex;gap:12px;overflow:hidden;white-space:nowrap;color:var(--muted);font-size:11px;margin-top:8px}.ticker span{animation:marquee 16s linear infinite}
.checkrow{display:grid;grid-template-columns:24px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.07)}
.check{width:20px;height:20px;border-radius:6px;border:1px solid rgba(242,217,138,.25);display:grid;place-items:center;color:#111;font-size:11px}.check.on{background:var(--goldHi);border-color:var(--goldHi)}
.bottomBar{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(680px,calc(100% - 24px));background:rgba(11,13,11,.86);border:1px solid rgba(242,217,138,.12);backdrop-filter:blur(18px);border-radius:18px;padding:7px;display:flex;gap:6px;z-index:10;box-shadow:0 18px 50px rgba(0,0,0,.45)}
.bottomBar .btn{flex:1;min-height:42px;padding:8px;font-size:11px}
.loading{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--muted);font-size:12px}.loader{width:18px;height:18px;border:2px solid rgba(242,217,138,.18);border-top-color:var(--goldHi);border-radius:50%;animation:spin 1s linear infinite}
@keyframes breathe{50%{transform:scale(1.035);box-shadow:0 0 110px rgba(216,179,76,.17),inset 0 0 52px rgba(216,179,76,.08)}}@keyframes pulse{50%{transform:scale(1.025);opacity:.4}}@keyframes shimmer{0%,55%{right:-30%}75%,100%{right:125%}}@keyframes sceneIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@keyframes sheetUp{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}@keyframes orbit{to{transform:translate(-50%,-50%) rotate(360deg)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes marquee{to{transform:translateX(-110%)}}
@media(min-width:720px){.shell{max-width:860px}.scene{min-height:720px}.bottomBar{position:sticky;bottom:12px}.hero{min-height:720px}}
</style>
</head>
<body>
<div class="ambient"><div class="halo"></div><div class="halo2"></div></div>
<div class="app"><div class="shell">
<header class="top"><div class="logo">KANZ<span>PAY</span> <b>BUYER</b></div><div class="small" id="saveState">Demo data · saved locally</div></header>
<div id="journey"></div>
<main id="view"></main>
</div><div id="modal" class="modal hidden"><div id="sheet" class="sheet"></div></div><nav class="bottomBar" id="bottom"></nav></div>
<script>
const S=JSON.parse(localStorage.getItem("kp-v2")||"null")||{
 stage:1,newUser:true,verified:false,goldMg:1,vault:{points:1250,memberships:2,promocodes:3,vouchers:2,connections:2},card:{active:false,profile:"Professional",name:"Your Name",phone:"",email:"",company:"",template:"Executive"},friends:3,expenses:[32,58,41,76,48],instruments:[{name:"Card",type:"card",connected:true,benefit:"5% grocery offer"},{name:"Bank Account",type:"bank",connected:true,benefit:"A2A eligible"},{name:"Other Card",type:"card",connected:false,benefit:"Connect to evaluate"}],orders:[{id:"#KZ-1042",seller:"Demo Kitchen",total:68,status:"Pending"},{id:"#KZ-1041",seller:"Urban Store",total:124,status:"In-Process"},{id:"#KZ-1038",seller:"Daily Market",total:92,status:"Completed"}],account:false
};
const $=s=>document.querySelector(s);const save=()=>{localStorage.setItem("kp-v2",JSON.stringify(S));$("#saveState").textContent="Demo data · saved locally"};function esc(t){return String(t).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}
function rail(){const names=["Start","Check User","Cockpit","Create"];$("#journey").innerHTML=`<div class="journey"><div class="rail">${names.map((n,i)=>`<div class="node ${S.stage===i+1?"active":S.stage>i+1?"done":""}"><div class="dot">${i+1}</div><div class="small">${n}</div></div>`).join("")}</div></div>`}
function render(){rail();$("#bottom").innerHTML=S.stage===1?`<button class="btn ghost" onclick="demoMode()">Use demo user</button><button class="btn primary" onclick="startTap()">Tap / Scan</button>`:S.stage===2?`<button class="btn ghost" onclick="showVault()">Value Vault</button><button class="btn primary" onclick="toStage3()">Continue</button>`:S.stage===3?`<button class="btn ghost" onclick="showCard()">Visiting Card</button><button class="btn primary" onclick="S.stage=4;save();render()">Create Account</button>`:`<button class="btn ghost" onclick="S.stage=3;save();render()">Back</button><button class="btn primary" onclick="completeAccount()">Complete</button>`;if(S.stage===1)scene1();if(S.stage===2)scene2();if(S.stage===3)scene3();if(S.stage===4)scene4()}
function scene1(){$("#view").innerHTML=`<section class="scene center"><div class="hero-inner"><div class="orb"><span>TAP · SCAN · START</span></div><div class="kicker">Guided Commerce Journey</div><h1>Your value journey starts here.</h1><p class="p">A living, connected journey that turns each interaction into a useful next step.</p><div class="actions"><button class="btn primary" onclick="startTap()">Tap to start</button><button class="btn" onclick="startScan()">Scan with camera</button></div><div class="ticker"><span>Water-like motion · breathing cards · connected value · micro-interactions · guided journey</span></div></div></section>`}
function startTap(){micro("Tap received");setTimeout(()=>{S.stage=2;S.newUser=Math.random()>.5;save();render()},420)}
function startScan(){micro("Camera URL captured");setTimeout(()=>{S.stage=2;S.newUser=Math.random()>.5;save();render()},420)}
function demoMode(){S.stage=2;S.newUser=false;S.verified=true;save();render()}
function micro(t){$("#saveState").textContent=t;setTimeout(()=>$("#saveState").textContent="Demo data · saved locally",1200)}
function scene2(){$("#view").innerHTML=`<section class="scene"><div class="kicker">STEP 2 · CHECK USER</div><h1>Let's connect you.</h1><p class="p">The system checks the user's state first, then guides the appropriate path without changing the journey sequence.</p><div class="stack" style="margin-top:18px">${S.newUser?newUserCard():existingCard()}</div></section>`}
function existingCard(){return`<div class="card shine"><div class="row"><div><div class="kicker">EXISTING USER</div><h2>Value Vault OK</h2></div><span class="statusDot"></span></div><p class="p">Connected value is available. A checkout request can continue through item and price verification.</p><div class="grid2" style="margin-top:13px"><button class="btn" onclick="showStore()">Store + Offers</button><button class="btn" onclick="showCheckout()">Checkout Request</button></div></div><div class="card actionable" onclick="showVault()"><div class="kicker">VALUE VAULT</div><h2>My connected value</h2><div class="pills"><span class="pill">${S.vault.points.toLocaleString()} Reward Points</span><span class="pill">${S.vault.memberships} Memberships</span><span class="pill">${S.vault.promocodes} Promocodes</span><span class="pill">${S.vault.vouchers} Vouchers</span></div><div class="actions"><button class="btn" onclick="event.stopPropagation();showVault()">Build / manage</button></div></div>`}
function newUserCard(){return`<div class="card shine"><div class="kicker">NEW USER</div><h2>Mobile No → OTP → Email → OTP</h2><p class="p">Verification is progressive. After the final OTP, the user receives the initial 1 mg Gold credit and builds the Value Vault.</p><div class="actions"><button class="btn primary" onclick="verifyNew()">Verify Mobile + Email</button></div></div>`}
function verifyNew(){S.verified=true;S.goldMg=Math.max(1,S.goldMg);S.newUser=false;save();openSheet(`<div class="kicker">VERIFICATION COMPLETE</div><h2>Congratulations — 1 mg Gold credited</h2><p class="p">The first value signal is now visible. Build your Value Vault to unlock more connections.</p><div class="card" style="margin-top:14px"><div class="metric">1.00 mg</div><div class="sub">Gold credited</div></div><div class="actions"><button class="btn primary" onclick="closeSheet();showVault(true)">Build my Value Vault</button></div>`)}
function toStage3(){S.stage=3;save();render()}
function showStore(){openSheet(`<div class="kicker">DISCOVERY</div><h2>Navigation to Store + Seller Offers</h2><div class="card" style="margin-top:12px"><div class="row"><div><b>Google Map</b><div class="sub">Nearby stores</div></div><button class="btn" onclick="toast("Map opened")">Open</button></div></div><div class="card" style="margin-top:9px"><div class="row"><div><b>Seller Offers</b><div class="sub">Promos relevant to this journey</div></div><span class="pill">3 live</span></div></div><div class="actions"><button class="btn primary" onclick="closeSheet()">Done</button></div>`)}
function showCheckout(){openSheet(`<div class="kicker">CHECKOUT REQUEST</div><h2>Check Items & Price</h2><div class="card" style="margin-top:12px"><div class="row"><span>Demo Basket</span><strong>AED 284</strong></div><div class="divider"></div><div class="row"><span>Golden Shimmer SKU count</span><span>4 items</span></div><div class="actions"><button class="btn primary" onclick="choosePayment()">OK · Choose method</button><button class="btn" onclick="closeSheet()">Edit</button></div></div>`)}
function choosePayment(){openSheet(`<div class="kicker">PAYMENT</div><h2>Choose method</h2><p class="p">Payment instruments can be A2A or Cards. Recommendation logic is shown separately in Payment Instrument Intelligence.</p><div class="grid2" style="margin-top:12px"><button class="btn primary" onclick="completePayment("A2A")">A2A</button><button class="btn" onclick="completePayment("Cards")">Cards</button></div>`)}
function completePayment(m){S.goldMg=+(S.goldMg+.1).toFixed(2);S.vault.points+=28;save();openSheet(`<div class="kicker">COMMERCE COMPLETED</div><h2>Mabrook!</h2><p class="p">Payment method: ${esc(m)}. The value loop continues automatically.</p><div class="card" style="margin-top:12px"><div class="metric">+${S.goldMg.toFixed(2)} mg</div><div class="sub">Gold balance</div></div><div class="actions"><button class="btn primary" onclick="closeSheet();S.stage=3;render()">Continue to Cockpit</button></div>`)}
function showVault(auto=false){openSheet(`<div class="kicker">MY VALUE VAULT</div><h2>Connect value, one card at a time.</h2><p class="p">Memberships, reward points, promo codes and vouchers stay visible with source, validity and user-approved connection history.</p><div class="stack" style="margin-top:13px"><div class="card"><div class="row"><b>Memberships</b><span class="pill">${S.vault.memberships}</span></div><div class="sub">Connect an app or program to save status and value.</div><button class="btn" style="margin-top:9px" onclick="addValue("memberships")">Add connection</button></div><div class="card"><div class="row"><b>Reward Points</b><span class="pill">${S.vault.points.toLocaleString()}</span></div><div class="sub">Store program value with expiry and validity where available.</div><button class="btn" style="margin-top:9px" onclick="addValue("points")">Connect program</button></div><div class="card"><div class="row"><b>Promocodes</b><span class="pill">${S.vault.promocodes}</span></div><button class="btn" style="margin-top:9px" onclick="addValue("promos")">Add / approve</button></div><div class="card"><div class="row"><b>Vouchers / Coupons</b><span class="pill">${S.vault.vouchers}</span></div><button class="btn" style="margin-top:9px" onclick="addValue("vouchers")">Add voucher</button></div><div class="card"><div class="kicker">CONNECTED SOURCE</div><div class="row"><span>Dynamic QR / App Redirect</span><span class="statusDot"></span></div><div class="sub">Credentials are user-approved, validity-aware and stored with history.</div></div></div><div class="actions"><button class="btn primary" onclick="closeSheet()">Done</button></div>`);if(auto)micro("Value Vault ready")}
function addValue(k){if(k==="memberships")S.vault.memberships++;if(k==="points")S.vault.points+=100;if(k==="promos")S.vault.promocodes++;if(k==="vouchers")S.vault.vouchers++;S.vault.connections++;save();micro("Vault updated");showVault()}
function scene3(){const connected=S.instruments.filter(x=>x.connected).length;$("#view").innerHTML=`<section class="scene"><div class="row"><div><div class="kicker">STEP 3 · COCKPIT</div><h1>My Cockpit</h1><p class="p">Six living modules. The interface changes emphasis based on what is actionable — without changing your journey.</p></div><span class="pill">${connected} instruments connected</span></div><div class="bento" style="margin-top:18px"><div class="card module actionable shine" onclick="showVault()"><div class="iconCircle">V</div><span class="kicker">3a · My Value Vault</span><strong>Connected value</strong><div class="metric">${S.vault.points.toLocaleString()}</div><div class="sub">Points · ${S.vault.memberships} memberships · ${S.vault.promocodes} promos</div></div><div class="card module actionable" onclick="showCard()"><div class="iconCircle">C</div><span class="kicker">3b · My Visiting Card</span><strong>${S.card.active?S.card.name:"Card setup"}</strong><div class="sub">${S.card.active?"Tap / Share · "+S.card.profile:"Add or configure card"}</div><div class="actions"><button class="btn" onclick="event.stopPropagation();showCard()">${S.card.active?"Tap / Share":"Configure"}</button></div></div><div class="card module actionable" onclick="showFriends()"><div class="iconCircle">F</div><span class="kicker">3c · Earn with Friends</span><strong>${S.friends} active</strong><div class="sub">Share the journey and track friend participation.</div></div><div class="card module actionable" onclick="showGold()"><div class="iconCircle">G</div><span class="kicker">3d · My Gold Vault</span><strong>${S.goldMg.toFixed(2)} mg</strong><div class="sub">Buy · Sell · Redeem · Deliver · Gift · Pay</div></div><div class="card module actionable" onclick="showExpenses()"><div class="iconCircle">E</div><span class="kicker">3e · My Expenses</span><strong>Expense intelligence</strong><div class="sub">Daily · Weekly · Monthly · Yearly</div></div><div class="card module actionable" onclick="showPayments()"><div class="iconCircle">P</div><span class="kicker">3f · Payment Instrument Intelligence</span><strong>Evaluate benefits</strong><div class="sub">Cards · bank accounts · approvals</div></div><div class="card module wide shine"><div class="row"><div><div class="kicker">VALUE & WEALTH BUILDING STATUS</div><h2>All set to earn more</h2><p class="p">The approved connections, rewards and instruments are ready to support the next commerce moment.</p></div><div class="metric">${Math.round(S.goldMg*100+S.vault.points/100)}%</div></div></div></div></section>`}
function showCard(){openSheet(`<div class="kicker">3b · MY VISITING CARD</div><h2>${S.card.active?"Tap / Share Card":"Add or Configure Card"}</h2><p class="p">Choose profile, mode and template. The same selected profile is used across NFC, QR, app share, WhatsApp, SMS and email.</p><div class="grid2" style="margin-top:12px"><div><div class="sub">Profile</div><select id="profile" class="input"><option>Personal</option><option ${S.card.profile==="Business"?"selected":""}>Business</option><option ${S.card.profile==="Professional"?"selected":""}>Professional</option><option>Friend</option><option>Social</option><option>Family</option><option>Maternal</option><option>Paternal</option><option>Custom</option></select></div><div><div class="sub">Template</div><select id="template" class="input"><option>Executive</option><option>Professional</option><option>Minimal</option><option>Social</option><option>Family</option><option>Creative</option><option>Custom</option></select></div></div><div class="field" style="margin-top:10px"><div class="sub">Name</div><input id="cardName" class="input" value="${esc(S.card.name)}"></div><div class="grid2"><div><div class="sub">Phone</div><input id="cardPhone" class="input" value="${esc(S.card.phone)}"></div><div><div class="sub">Email</div><input id="cardEmail" class="input" value="${esc(S.card.email)}"></div></div><div class="field"><div class="sub">Company / Context</div><input id="cardCompany" class="input" value="${esc(S.card.company)}"></div><div class="actions"><button class="btn primary" onclick="saveCard()">Save & Activate</button><button class="btn" onclick="closeSheet()">Cancel</button></div>`)}
function saveCard(){S.card.active=true;S.card.profile=$("#profile").value;S.card.template=$("#template").value;S.card.name=$("#cardName").value||"Your Name";S.card.phone=$("#cardPhone").value;S.card.email=$("#cardEmail").value;S.card.company=$("#cardCompany").value;save();openSheet(`<div class="kicker">CARD ACTIVE</div><h2>${esc(S.card.name)}</h2><p class="p">${esc(S.card.profile)} · ${esc(S.card.template)}</p><div class="card" style="margin-top:12px"><div class="row"><span>NFC payload</span><span class="pill">Compact URL</span></div><div class="sub" style="margin-top:6px">card.kanzpay.com/c/review/${encodeURIComponent(S.card.profile.toLowerCase())}</div></div><div class="actions"><button class="btn primary" onclick="shareCard()">Tap / Share</button><button class="btn" onclick="closeSheet()">Done</button></div>`)}
function shareCard(){navigator.clipboard?.writeText("https://card.kanzpay.com/c/review/"+encodeURIComponent(S.card.profile.toLowerCase())).catch(()=>{});toast("Share actions ready: NFC · QR · WhatsApp · SMS · Email")}
function showFriends(){openSheet(`<div class="kicker">3c · EARN WITH FRIENDS</div><h2>Share the journey.</h2><p class="p">A guided share card keeps the referral context intact across WhatsApp, SMS, email or a copied link.</p><div class="card" style="margin-top:12px"><div class="metric">${S.friends}</div><div class="sub">Friends participating</div></div><div class="actions"><button class="btn primary" onclick="S.friends++;save();toast("Invite shared");closeSheet()">Share Invite</button><button class="btn" onclick="closeSheet()">Done</button></div>`)}
function showGold(){openSheet(`<div class="kicker">3d · MY GOLD VAULT</div><h2>${S.goldMg.toFixed(2)} mg</h2><p class="p">Gold weight with current value context and +/- change versus acquisition.</p><div class="grid2" style="margin-top:12px"><button class="btn" onclick="S.goldMg=+(S.goldMg+.2).toFixed(2);save();showGold()">Buy</button><button class="btn" onclick="toast("Sell flow staged")">Sell</button><button class="btn" onclick="toast("Redeem flow staged")">Redeem</button><button class="btn" onclick="toast("Physical delivery staged")">Deliver physical</button><button class="btn" onclick="toast("Gift flow staged")">Gift</button><button class="btn primary" onclick="toast("Pay with Gold staged")">Pay with Gold</button></div><div class="actions"><button class="btn" onclick="closeSheet()">Done</button></div>`)}
function showExpenses(){openSheet(`<div class="kicker">3e · MY EXPENSES</div><h2>Category-wise expense intelligence</h2><p class="p">Daily / Weekly / Monthly / Yearly progression.</p><div class="chart">${S.expenses.map(v=>`<div class="bar" style="height:${v}%"></div>`).join("")}</div><div class="pills"><span class="pill">Food · 32%</span><span class="pill">Shopping · 24%</span><span class="pill">Travel · 16%</span><span class="pill">Bills · 12%</span></div><div class="actions"><button class="btn primary" onclick="closeSheet()">Done</button></div>`)}
function showPayments(){openSheet(`<div class="kicker">3f · PAYMENT INSTRUMENT INTELLIGENCE</div><h2>Evaluate instrument-wise offers & benefits</h2><p class="p">Connected instruments are active; unconnected options stay visually muted until the user authorises a connection.</p><div style="margin-top:10px">${S.instruments.map((x,i)=>`<div class="checkrow"><div class="check ${x.connected?"on":""}" onclick="toggleInstrument(${i})">${x.connected?"✓":""}</div><div><b>${esc(x.name)}</b><div class="sub">${esc(x.benefit)}</div></div><span class="pill">${x.connected?"Connected":"Connect"}</span></div>`).join("")}</div><div class="actions"><button class="btn primary" onclick="approveRecommendation()">Approve recommendation logic</button><button class="btn" onclick="closeSheet()">Later</button></div>`)}
function toggleInstrument(i){S.instruments[i].connected=!S.instruments[i].connected;save();showPayments()}
function approveRecommendation(){const n=S.instruments.filter(x=>x.connected).length;openSheet(`<div class="kicker">APPROVED</div><h2>Step 3 + 4 value & wealth building status</h2><p class="p">Recommendation logic approved for ${n} connected instruments.</p><div class="card" style="margin-top:12px"><div class="metric">All set</div><div class="sub">to earn more</div></div><div class="actions"><button class="btn primary" onclick="closeSheet()">Continue</button></div>`)}
function scene4(){$("#view").innerHTML=`<section class="scene"><div class="kicker">STEP 4 · CREATE ACCOUNT</div><h1>Complete your account.</h1><p class="p">This is the existing account flow represented as a working guided task: Emirates ID front + back, live camera actions, document checks, photo match and AML review.</p><div class="stack" style="margin-top:18px"><div class="card"><div class="row"><div><div class="kicker">IDENTITY</div><h2>Emirates ID</h2><p class="p">Front + back</p></div><span class="pill">Required</span></div><div class="actions"><button class="btn" onclick="toast("Front ID added")">Add front</button><button class="btn" onclick="toast("Back ID added")">Add back</button></div></div><div class="card"><div class="kicker">LIVE CAMERA</div><h2>Guided liveness</h2><p class="p">Blink · look left · look right · hold Emirates ID</p><div class="actions"><button class="btn" onclick="runCamera()">Start live camera</button></div></div><div class="card"><div class="kicker">CHECK</div><h2>Document + AML</h2><div class="checkrow"><div class="check on">✓</div><div><b>Document crop / edit</b><div class="sub">Demo processing</div></div><span class="pill">Ready</span></div><div class="checkrow"><div class="check">${S.account?"✓":""}</div><div><b>Photo match with document</b><div class="sub">Verification</div></div><span class="pill">Review</span></div><div class="checkrow"><div class="check">${S.account?"✓":""}</div><div><b>AML check</b><div class="sub">All parameters</div></div><span class="pill">Review</span></div></div></div></section>`}
function runCamera(){openSheet(`<div class="kicker">LIVE CAMERA</div><h2>Follow the guide</h2><div class="card" style="margin-top:12px;text-align:center"><div class="orb" style="width:110px;height:110px;margin:0 auto 16px"><span>LIVE</span></div><p class="p">Blink · look left · look right · hold Emirates ID front/back</p></div><div class="actions"><button class="btn primary" onclick="S.account=true;save();closeSheet();render()">Complete check</button></div>`)}
function completeAccount(){S.account=true;save();toast("Account flow completed in demo mode")}
function toast(t){micro(t);openSheet(`<div class="kicker">KANZPAY</div><h2>${esc(t)}</h2><div class="actions"><button class="btn primary" onclick="closeSheet()">OK</button></div>`)}
function openSheet(html){$("#sheet").innerHTML=html;$("#modal").classList.remove("hidden")}
function closeSheet(){$("#modal").classList.add("hidden")}
$("#modal").addEventListener("click",e=>{if(e.target.id==="modal")closeSheet()});
render();
if("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script>
</body>
</html>
