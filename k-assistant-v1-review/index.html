<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>K-Assistant v1.0 · Buyer & Seller Review Build</title>
<style>
:root{--bg:#0d0c0b;--panel:rgba(255,255,255,.075);--line:rgba(255,255,255,.13);--text:#f7f2e8;--muted:#b8afa3;--gold:#d7ad57;--gold2:#f0d58f;--cream:#fbf7ef;--ink:#211a16;--green:#94c98d}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 75% 5%,rgba(215,173,87,.18),transparent 28%),radial-gradient(circle at 15% 70%,rgba(255,255,255,.05),transparent 30%),var(--bg);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);min-height:100vh}
button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{max-width:1180px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:18px}.brand{display:flex;gap:12px;align-items:center}.logo{width:42px;height:42px;border:1px solid #d7ad57;border-radius:50%;display:grid;place-items:center;color:var(--gold2);font-weight:900;box-shadow:0 0 28px rgba(215,173,87,.18)}.brand b{font-size:18px}.brand span{display:block;color:var(--muted);font-size:12px;margin-top:3px}.switch{display:flex;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:999px;padding:4px}.switch button{background:transparent;border:0;color:var(--muted);padding:9px 14px;border-radius:999px}.switch button.active{background:var(--gold);color:#21180c;font-weight:800}.stage{font-size:11px;letter-spacing:.15em;color:var(--gold2);text-transform:uppercase}.grid{display:grid;grid-template-columns:1.25fr .75fr;gap:18px}.card{background:linear-gradient(145deg,rgba(255,255,255,.095),rgba(255,255,255,.045));border:1px solid var(--line);border-radius:28px;padding:22px;box-shadow:0 30px 80px rgba(0,0,0,.25);backdrop-filter:blur(18px)}.hero{min-height:430px;display:flex;flex-direction:column;justify-content:space-between}.h1{font-size:44px;line-height:1.04;margin:12px 0}.muted{color:var(--muted);line-height:1.55}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:18px}.primary,.secondary,.danger{border-radius:13px;padding:12px 16px;border:1px solid var(--line)}.primary{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#21180c;font-weight:850}.secondary{background:rgba(255,255,255,.07);color:var(--text)}.danger{background:rgba(180,50,50,.12);color:#ffc1b8}.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{border:1px solid var(--line);border-radius:18px;padding:15px;background:rgba(255,255,255,.045)}.tile b{display:block;margin-bottom:5px}.small{font-size:12px;color:var(--muted)}.progress{height:5px;background:#ffffff12;border-radius:99px;overflow:hidden;margin:14px 0}.progress i{display:block;height:100%;background:var(--gold);width:0;transition:.3s}.hidden{display:none!important}.screen h2{margin:5px 0 8px;font-size:28px}.screen{min-height:510px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.qty button{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:#ffffff08;color:var(--text)}.pill{display:inline-block;border:1px solid #d7ad5750;color:var(--gold2);background:#d7ad5712;border-radius:99px;padding:6px 9px;font-size:11px}.profile-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.profile{border:1px solid var(--line);background:#ffffff05;color:var(--muted);border-radius:15px;padding:12px;text-align:left}.profile.active{border-color:#d7ad57;background:#d7ad5718;color:var(--gold2)}.field{display:grid;gap:6px;margin:10px 0}.field label{font-size:11px;color:var(--muted)}.field input,.field textarea{width:100%;background:#0005;border:1px solid var(--line);border-radius:11px;padding:11px;color:var(--text)}.preview{border-radius:22px;padding:24px;min-height:220px;background:linear-gradient(145deg,#f7f0df,#cfae67);color:#241b14;position:relative;overflow:hidden}.preview:after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;right:-60px;top:-50px;background:#fff7;filter:blur(10px)}.avatar{width:62px;height:62px;border-radius:50%;background:#241b14;color:#e9ca83;display:grid;place-items:center;font-size:22px;font-weight:900}.profile-page{background:var(--cream);color:var(--ink);border-radius:25px;padding:26px}.profile-page .muted{color:#6f665e}.tag{display:inline-flex;gap:7px;align-items:center;padding:7px 10px;border-radius:99px;background:#ead9ad;font-size:11px}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#f8efd9;color:#251b12;border-radius:13px;padding:12px 16px;font-weight:750;box-shadow:0 20px 50px #0008;z-index:5}.notice{padding:12px 14px;border-left:3px solid var(--gold);background:#d7ad5710;border-radius:8px;color:#e6dac7}.seller-list{display:grid;gap:9px}.status{padding:10px 12px;border-radius:12px;background:#ffffff07;border:1px solid var(--line)}@media(max-width:850px){.grid{grid-template-columns:1fr}.h1{font-size:35px}.profile-grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="shell">
<div class="top"><div class="brand"><div class="logo">K</div><div><b>K-Assistant</b><span>v1.0 · buyer + seller review build</span></div></div><div class="switch"><button id="buyerBtn" class="active" onclick="mode('buyer')">Buyer</button><button id="sellerBtn" onclick="mode('seller')">Seller</button></div></div>
<div id="app"></div>
</div>
<script>
const profiles=['Personal','Business','Professional','Friend','Social','Family','Maternal','Paternal','Custom'];
let S={mode:'buyer',view:'home',profile:'Professional',qty:2,issued:false,activeProfile:'Professional',name:'Navneet Sharma',company:'KanzPay',title:'Founder & CEO',phone:'+971 50 000 0000',email:'hello@example.com',bio:'Commerce, technology and partnerships.',template:'Executive',paid:false};
const price=18, cake=42;
function toast(t){let x=document.createElement('div');x.className='toast';x.textContent=t;document.body.appendChild(x);setTimeout(()=>x.remove(),1800)}
function mode(m){S.mode=m;S.view=m==='buyer'?'home':'seller';document.getElementById('buyerBtn').classList.toggle('active',m==='buyer');document.getElementById('sellerBtn').classList.toggle('active',m==='seller');render()}
function btn(t,f,c='secondary'){return '<button class="'+c+'" onclick="'+f+'">'+t+'</button>'}
function shell(title,sub,body,actions=''){return '<div class="grid"><section class="card screen"><div class="stage">K-ASSIST · '+S.mode+'</div><h2>'+title+'</h2><p class="muted">'+sub+'</p><div class="progress"><i style="width:'+({home:20,card:40,profile:55,preview:70,nfc:85,share:100,basket:45,payment:70,paid:88,handover:100,seller:25,issue:55}[S.view]||20)+'%"></i></div>'+body+'<div class="actions">'+actions+'</div></section><aside class="card">'+side()+'</aside></div>'}
function side(){if(S.mode==='seller')return '<div class="stage">Seller control</div><h3>Buyer relationship</h3><div class="seller-list"><div class="status">Free NFC card: '+(S.issued?'ISSUED':'READY TO ISSUE')+'</div><div class="status">Outlet drivers: Membership · Points · Voucher</div><div class="status">Draft: '+(S.paid?'PAID':'AED 73 pending')+'</div><div class="status">Private profiles: <b>not visible</b></div></div>';return '<div class="stage">Your identity</div><h3>'+S.activeProfile+' profile</h3><p class="muted">Tap to share only the profile you select. Your other profiles remain private.</p><div class="tiles"><div class="tile"><b>NFC</b><span class="small">Active card</span></div><div class="tile"><b>500 KB</b><span class="small">cloud profile budget</span></div></div>'}
function buyer(){switch(S.view){
case'home':return shell('Today, made useful.','Your checkout, value vault and Visiting Card live together on one calm surface.','<div class="tiles"><div class="tile"><b>Value Vault</b><span class="small">Share only seller-applicable value</span></div><div class="tile" onclick="S.view=\'card\';render()"><b>Visiting Card</b><span class="small">Tap to share · '+S.activeProfile+'</span></div></div><div class="notice" style="margin-top:14px">Free NFC card from your seller · select a profile before every share.</div>',btn('Open Visiting Card',"S.view='card';render()",'primary')+btn('Review checkout',"S.view='basket';render()'));
case'card':return shell('Your Visiting Card.','One physical NFC card. Multiple identities. You choose what the next person receives.','<div class="profile-grid">'+profiles.map(p=>'<button class="profile '+(S.activeProfile===p?'active':'')+'" onclick="S.activeProfile=\''+p+'\';S.profile=p;render()">'+p+'</button>').join('')+'</div><div class="preview" style="margin-top:15px"><div class="tag">NFC · ACTIVE PROFILE</div><div style="display:flex;gap:15px;align-items:center;margin-top:22px"><div class="avatar">'+S.name.split(' ').map(x=>x[0]).join('').slice(0,2)+'</div><div><h2 style="margin:0">'+S.name+'</h2><b>'+S.title+' · '+S.company+'</b><p style="margin:7px 0 0;max-width:500px">'+S.bio+'</p></div></div></div>',btn('Customize',"S.view='profile';render()",'primary')+btn('Preview page',"S.view='preview';render()')+btn('Program / test NFC',"S.view='nfc';render()'));
case'profile':return shell('Customize '+S.profile+'.','Only fields you enable for this profile will be shared or placed in its vCard.','<div class="field"><label>Display name</label><input id="n" value="'+S.name+'"></div><div class="field"><label>Company / context</label><input id="c" value="'+S.company+'"></div><div class="field"><label>Title / relationship</label><input id="t" value="'+S.title+'"></div><div class="field"><label>Phone</label><input id="p" value="'+S.phone+'"></div><div class="field"><label>Email</label><input id="e" value="'+S.email+'"></div><div class="field"><label>Short profile</label><textarea id="b">'+S.bio+'</textarea></div><div class="field"><label>Template</label><select id="tpl"><option>Executive</option><option>Professional</option><option>Minimal</option><option>Social</option><option>Family</option><option>Creative</option><option>Custom</option></select></div>',btn('Save profile',"saveProfile()",'primary')+btn('Back',"S.view='card';render()'));
case'preview':return shell('Your profile page.','This is the rich page opened after an NFC tap. The recipient can save the selected identity as a vCard.','<div class="profile-page"><span class="tag">KanzPay Visiting Card · '+S.profile+'</span><h1 style="font-size:36px;margin:20px 0 5px">'+S.name+'</h1><h3 style="margin:0">'+S.title+' · '+S.company+'</h3><p class="muted">'+S.bio+'</p><div class="tiles"><div class="tile"><b>Phone</b><span>'+S.phone+'</span></div><div class="tile"><b>Email</b><span>'+S.email+'</span></div></div></div>',btn('Save as vCard',"downloadVcard()",'primary')+btn('Share profile',"S.view='share';render()')+btn('Back',"S.view='card';render()"));
case'nfc':return shell('Tap-ready NFC card.','The sticker stores a compact NDEF URL; the rich profile stays online. This keeps the tag small and the experience fast.','<div class="preview" style="background:linear-gradient(145deg,#191613,#33281b);color:#f5e4bd;text-align:center"><div style="font-size:68px;margin:15px">◉</div><h2>Tap phone to share</h2><p style="color:#c9bda9">Active: '+S.profile+' · card_kanz_001</p><code style="font-size:11px">https://card.kanzpay.com/c/card_kanz_001/'+S.profile.toLowerCase()+'</code></div><div class="notice" style="margin-top:14px">NFC payload target: compact URL. Complete profile package remains ≤500 KB in the cloud.</div>',btn('Test tap',"toast('NFC tap simulated — opening '+S.profile+' profile')",'primary')+btn('Open recipient page',"S.view='preview';render()") );
case'share':return shell('Ready to share.','Your '+S.profile+' identity is active. Tap, QR, WhatsApp, email or link all resolve to this same profile.','<div class="notice">Recipient will see only '+S.profile+' fields. Other profiles remain private.</div><div class="tiles" style="margin-top:15px"><div class="tile"><b>NFC tap</b><span class="small">Physical card</span></div><div class="tile"><b>Save Contact</b><span class="small">Standard vCard</span></div><div class="tile"><b>QR / Link</b><span class="small">Fallback sharing</span></div><div class="tile"><b>Revoke</b><span class="small">Disable card instantly</span></div></div>',btn('Save vCard',"downloadVcard()",'primary')+btn('Back to card',"S.view='card';render()")); 
case'basket':let total=S.qty*price+cake-5;return shell('Your basket.','Seller draft: 2 × Coffee AED 18 + Cake AED 42 − AED 5 seller benefit. You can change the basket without seller approval.','<div class="row"><span>Coffee · AED 18</span><span class="qty"><button onclick="S.qty=Math.max(0,S.qty-1);render()">−</button> '+S.qty+' <button onclick="S.qty++;render()">+</button></span></div><div class="row"><span>Cake · AED 42</span><span>1</span></div><div class="row"><b>Pay now</b><b>AED '+total.toFixed(2)+'</b></div><div class="notice" style="margin-top:15px">'+(S.qty!==2?'Seller will receive the changed line after payment.':'Draft matches seller basket.')+'</div>',btn('Choose payment',"S.view='payment';render()",'primary')+btn('Visiting Card',"S.view='card';render()")); 
case'payment':let pay=S.qty*price+cake-5;return shell('Pay securely.','Payment is executed by the existing payment service. K-Assistant never invents payment success.','<div class="tiles"><div class="tile"><b>Bank account</b><span class="small">A2A · provider confirmation required</span></div><div class="tile"><b>Card</b><span class="small">Eligible offer shown only after verification</span></div></div><div class="preview" style="margin-top:15px;min-height:120px;background:#211b15;color:#f5e4bd"><span class="small">Verified payable</span><div style="font-size:42px;font-weight:900;margin-top:8px">AED '+pay.toFixed(2)+'</div></div>',btn('Approve & pay',"S.paid=true;S.view='paid';render()",'primary')+btn('Edit basket',"S.view='basket';render()")); 
case'paid':return shell('Payment confirmed.','The seller receives the paid basket and any changed-line reconciliation requirement.','<div class="tiles"><div class="tile"><b>Paid</b><span>AED '+(S.qty*price+cake-5).toFixed(2)+'</span></div><div class="tile"><b>Exit code</b><span>KZ-7A29C1</span></div></div><div class="notice" style="margin-top:15px">'+(S.qty!==2?'Handover check required: seller must reconcile changed items, final invoice and physical basket.':'No basket changes — seller can verify payment and hand over.')+'</div>',btn(S.qty!==2?'See handover':'Done', "S.view='"+(S.qty!==2?'handover':'home')+"';render()",'primary')+btn('Visiting Card',"S.view='card';render()")); 
case'handover':return shell('Ready together.','Seller checks changed lines against the paid basket, then confirms the final invoice and physical goods.','<div class="row"><span>Original Coffee</span><span>2</span></div><div class="row"><span>Paid Coffee</span><span><b>1</b></span></div><div class="row"><span>Final invoice</span><span><b>AED '+(S.qty*price+cake-5).toFixed(2)+'</b></span></div><div class="row"><span>Physical check</span><span class="pill">REQUIRED</span></div>',btn('Confirm seller handover',"toast('Handover confirmed in review build');S.view='home';render()",'primary'));default:return ''}}
function seller(){if(S.view==='seller')return shell('K-Assistant at the seller.','Issue the buyer a free NFC Visiting Card alongside the commerce journey.','<div class="tiles"><div class="tile"><b>Buyer session</b><span class="small">K-Tag · Food Cafe</span></div><div class="tile"><b>Free NFC card</b><span class="small">'+(S.issued?'Issued':'Ready')+'</span></div></div><div class="notice" style="margin-top:15px">Seller can issue the physical card, but never sees the buyer's private profile contents.</div>',btn('Issue Free Card',"S.view='issue';render()",'primary')+btn('Open draft',"S.view='basket';S.mode='buyer';mode('buyer')"));if(S.view==='issue')return shell('Issue free NFC Visiting Card.','The seller gives the buyer one physical NFC sticker/tag. The buyer activates and controls every profile.','<div class="preview"><span class="tag">FREE SELLER-ISSUED CARD</span><h2 style="margin-top:25px">K-Assistant Visiting Card</h2><p>One tap. Multiple identities. Buyer controlled.</p><div class="small">Seller sees: issued status only · Buyer owns profile privacy.</div></div>',btn('Confirm card issued',"S.issued=true;S.view='seller';render();toast('Free NFC card issued')",'primary')+btn('Cancel',"S.view='seller';render()"));return shell('Seller dashboard.','Operational view of outlet transactions, drafts, reconciliation and card issuance.','<div class="tiles"><div class="tile"><b>Draft</b><span>AED 73 → buyer editable</span></div><div class="tile"><b>Card issued</b><span>'+(S.issued?'1 active':'0')+'</span></div><div class="tile"><b>Private data</b><span>Blocked</span></div><div class="tile"><b>Handover</b><span>'+ (S.paid?'Reconcile':'Await payment')+'</span></div></div>',btn('Buyer simulation',"mode('buyer')",'primary')+btn('Issue Free Card',"S.view='issue';render()"))}
function saveProfile(){S.name=document.getElementById('n').value;S.company=document.getElementById('c').value;S.title=document.getElementById('t').value;S.phone=document.getElementById('p').value;S.email=document.getElementById('e').value;S.bio=document.getElementById('b').value;S.template=document.getElementById('tpl').value;S.view='card';render();toast('Profile saved')}
function downloadVcard(){let v='BEGIN:VCARD\nVERSION:3.0\nFN:'+S.name+'\nTEL:'+S.phone+'\nEMAIL:'+S.email+'\nORG:'+S.company+'\nTITLE:'+S.title+'\nURL:https://card.kanzpay.com/c/card_kanz_001/'+S.profile.toLowerCase()+'\nEND:VCARD';let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([v],{type:'text/vcard'}));a.download=S.name.replaceAll(' ','_')+'_'+S.profile+'.vcf';a.click();toast('vCard generated')}
function render(){document.getElementById('app').innerHTML=S.mode==='buyer'?buyer():seller()}
render();
</script>
</body>
</html>
