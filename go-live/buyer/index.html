<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d0c"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./manifest.json"><title>KANZPAY Buyer</title>
<style>
:root{--bg:#070908;--panel:rgba(22,25,22,.78);--line:rgba(212,175,55,.25);--gold:#d8b34c;--gold2:#f2d98a;--text:#f4f0e5;--muted:#a9a79e;--green:#7ca987}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#28251b 0,#0a0c0b 42%,#050605 100%);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}button,input{font:inherit}button{cursor:pointer}.shell{max-width:1180px;margin:auto;padding:18px 18px 44px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:800;letter-spacing:.22em}.brand b{color:var(--gold2)}.status{font-size:12px;color:var(--muted)}.hero{min-height:55vh;display:grid;place-items:center;text-align:center;position:relative}.orb{width:210px;height:210px;border-radius:50%;border:1px solid rgba(216,179,76,.5);box-shadow:0 0 80px rgba(216,179,76,.14),inset 0 0 50px rgba(216,179,76,.08);display:grid;place-items:center;animation:breathe 4s ease-in-out infinite}.orb:before{content:"";position:absolute;width:300px;height:300px;border:1px solid rgba(216,179,76,.09);border-radius:50%;animation:spin 18s linear infinite}.orb span{font-size:14px;color:var(--gold2);letter-spacing:.15em}.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:22px}.btn{border:1px solid var(--line);background:rgba(18,20,18,.8);color:var(--text);padding:12px 18px;border-radius:14px}.btn.primary{background:linear-gradient(120deg,#9e7a22,#ead27b 48%,#a77e24);color:#111;border:0;font-weight:800}.btn.ghost{background:transparent}.hidden{display:none!important}.stepbar{display:flex;gap:8px;margin:10px 0 18px}.step{flex:1;padding:8px;border:1px solid rgba(255,255,255,.08);border-radius:999px;text-align:center;font-size:11px;color:var(--muted)}.step.on{color:#17150f;background:var(--gold2);border-color:var(--gold2);font-weight:800}.card{background:linear-gradient(145deg,rgba(30,32,28,.86),rgba(13,15,13,.72));border:1px solid rgba(216,179,76,.18);border-radius:22px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.25);backdrop-filter:blur(18px)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.bento{min-height:190px;position:relative;overflow:hidden}.bento:after{content:"";position:absolute;inset:auto -30px -50px auto;width:130px;height:130px;border-radius:50%;background:rgba(216,179,76,.07);filter:blur(18px)}.kicker{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--gold2)}h1{font-size:clamp(28px,5vw,52px);margin:10px 0}h2{margin:8px 0;font-size:22px}h3{margin:8px 0}.muted{color:var(--muted)}.value{font-size:34px;font-weight:800;color:var(--gold2)}.mini{font-size:12px;color:var(--muted)}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.list{display:grid;gap:8px;margin-top:14px}.pill{display:inline-flex;padding:6px 9px;border-radius:999px;background:rgba(216,179,76,.09);color:var(--gold2);font-size:11px}.module{cursor:pointer;transition:.25s transform,.25s border-color}.module:hover{transform:translateY(-3px);border-color:rgba(216,179,76,.48)}.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:grid;place-items:center;padding:20px;z-index:20}.modalbox{max-width:650px;width:100%;max-height:90vh;overflow:auto}.field{display:grid;gap:6px;margin:12px 0}.field input{background:#0c0f0d;border:1px solid rgba(255,255,255,.1);border-radius:11px;padding:11px;color:white}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#151813;border:1px solid var(--line);padding:10px 14px;border-radius:999px;color:var(--gold2);z-index:30}.goldline{height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:14px 0}.tag{font-size:10px;color:#111;background:var(--gold2);padding:4px 7px;border-radius:6px;font-weight:800}.chart{height:110px;display:flex;align-items:end;gap:8px}.bar{flex:1;background:linear-gradient(180deg,var(--gold2),#80621f);border-radius:6px 6px 0 0;min-height:12px}.nav{display:flex;gap:8px;overflow:auto;padding-bottom:4px}.nav .btn{white-space:nowrap}@keyframes breathe{50%{transform:scale(1.035);box-shadow:0 0 110px rgba(216,179,76,.2),inset 0 0 60px rgba(216,179,76,.1)}}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:820px){.grid{grid-template-columns:1fr 1fr}.hero{min-height:48vh}}@media(max-width:560px){.grid{grid-template-columns:1fr}.shell{padding:14px}.hero{min-height:54vh}.orb{width:170px;height:170px}.orb:before{width:245px;height:245px}}
</style></head>
<body>
<div class="shell">
<header class="top"><div class="brand">KANZ<span>PAY</span> <b>BUYER</b></div><div class="status" id="status">Local review mode</div></header>
<div class="stepbar"><div id="s1" class="step on">1 · Tap / Scan</div><div id="s2" class="step">2 · Check User</div><div id="s3" class="step">3 · Cockpit</div><div id="s4" class="step">4 · Create Account</div></div>
<main id="app"></main>
</div>
<div id="modal" class="modal hidden"><div class="modalbox card" id="modalbox"></div></div>
<div id="toast" class="toast hidden"></div>
<script>
const A={step:1,existing:localStorage.getItem('kp_user')==='1',vault:JSON.parse(localStorage.getItem('kp_vault')||'{"points":1250,"promos":3,"vouchers":2,"memberships":2}'),gold:+localStorage.getItem('kp_gold')||1,profile:JSON.parse(localStorage.getItem('kp_profile')||'{"name":"Your Name","role":"Professional","phone":"","email":"","company":""}'),card:localStorage.getItem('kp_card')==='1'};
const $=s=>document.querySelector(s); const save=()=>{localStorage.setItem('kp_vault',JSON.stringify(A.vault));localStorage.setItem('kp_gold',A.gold);localStorage.setItem('kp_profile',JSON.stringify(A.profile));localStorage.setItem('kp_card',A.card?'1':'0');};
function toast(t){$('#toast').textContent=t;$('#toast').classList.remove('hidden');setTimeout(()=>$('#toast').classList.add('hidden'),2200)}
function step(n){A.step=n;for(let i=1;i<5;i++)$('#s'+i).classList.toggle('on',i===n)}
function render(){step(A.step); if(A.step===1)entry(); if(A.step===2)checkUser(); if(A.step===3)cockpit(); if(A.step===4)account();}
function entry(){ $('#app').innerHTML=`
<section class="hero"><div><div class="orb"><span>TAP · SCAN · START</span></div><h1>Your value journey starts here.</h1><p class="muted">Tap or scan to start the journey. The interface will progressively build your Value Vault and Cockpit.</p><div class="actions"><button class="btn primary" onclick="start('tap')">Tap to start</button><button class="btn" onclick="start('scan')">Scan QR / URL</button></div><p class="mini">1a Tap · 1b Scan · both continue to Web App Started</p></div></section>`; }
function start(type){toast(type==='tap'?'NFC / tap trigger received':'Camera / QR trigger received');setTimeout(()=>{A.step=2;render()},500)}
function checkUser(){ $('#app').innerHTML=`
<section class="card"><span class="kicker">STEP 2 · CHECK USER</span><h1>Check User</h1><p class="muted">The same journey supports existing users and new users. Choose a path for this working review app.</p>
<div class="actions"><button class="btn ${A.existing?'primary':''}" onclick="existing(true)">Existing user</button><button class="btn ${!A.existing?'primary':''}" onclick="existing(false)">New user</button></div>
<div id="branch" class="goldline"></div><div id="branchBody"></div></section>`; existing(A.existing)}
function existing(v){A.existing=v;const b=$('#branchBody'); if(!b)return;if(v){b.innerHTML=`<div class="grid"><div class="card"><span class="kicker">VALUE VAULT</span><h3>Value Vault OK?</h3><p class="muted">Your connected value sources are available.</p><button class="btn primary" onclick="checkout()">Continue</button></div><div class="card"><span class="kicker">CHECKOUT REQUEST</span><h3>Existing commerce</h3><p class="muted">Check items and price → choose method → payment → Gold credit.</p><button class="btn" onclick="checkout()">Open checkout</button></div></div>`}else{b.innerHTML=`<div class="card"><span class="kicker">NEW USER</span><h3>Mobile No → OTP Verify → Email ID → OTP Verify</h3><p class="muted">After verification, the journey credits the initial value and invites the user to build the Value Vault.</p><button class="btn primary" onclick="verify()">Verify user</button></div>`}}
function verify(){A.existing=true;localStorage.setItem('kp_user','1');A.gold=Math.max(A.gold,1);toast('Congratulations · 1 mg Gold credited');setTimeout(()=>valueVault(),650)}
function checkout(){const ok=confirm('Check Items, Price → OK → Pay. Continue to payment method selection?');if(!ok)return;const method=prompt('Choose method: A2A or Cards','A2A');if(!method)return;A.gold+=0.1;save();toast('Payment recorded · Gold credited');setTimeout(()=>valueVault(),700)}
function valueVault(){A.step=3;render();toast('Value Vault connected · Cockpit ready')}
function cockpit(){ $('#app').innerHTML=`
<div class="row"><div><span class="kicker">STEP 3 · COCKPIT</span><h1>My Cockpit</h1><p class="muted">Six modules are available together. The interface surfaces what needs attention without changing the underlying journey.</p></div><span class="tag">6 MODULES</span></div>
<div class="grid">
<div class="card bento module" onclick="vault()"><span class="kicker">3a</span><h2>My Value Vault</h2><div class="value">${A.vault.points.toLocaleString()}</div><div class="mini">Reward Points · ${A.vault.promos} Promocodes · ${A.vault.vouchers} Vouchers</div></div>
<div class="card bento module" onclick="visiting()"><span class="kicker">3b</span><h2>My Visiting Card</h2><p class="muted">${A.card?'Active · '+A.profile.name:'Add or configure card'}</p><button class="btn primary" onclick="event.stopPropagation();visiting()">${A.card?'Tap / Share Card':'Add Card'}</button></div>
<div class="card bento module" onclick="friends()"><span class="kicker">3c</span><h2>Earn with Friends</h2><p class="muted">Share a referral journey and track friend participation.</p><button class="btn" onclick="event.stopPropagation();friends()">Share</button></div>
<div class="card bento module" onclick="gold()"><span class="kicker">3d</span><h2>My Gold Vault</h2><div class="value">${A.gold.toFixed(2)} mg</div><div class="mini">Buy · Sell · Redeem · Gift · Pay</div></div>
<div class="card bento module" onclick="expenses()"><span class="kicker">3e</span><h2>My Expenses</h2><div class="chart"><i class="bar" style="height:55%"></i><i class="bar" style="height:82%"></i><i class="bar" style="height:42%"></i><i class="bar" style="height:68%"></i><i class="bar" style="height:35%"></i></div><div class="mini">Daily · Weekly · Monthly · Yearly</div></div>
<div class="card bento module" onclick="payments()"><span class="kicker">3f</span><h2>Payment Instrument Intelligence</h2><p class="muted">Evaluate instrument-wise offers and benefits.</p><button class="btn" onclick="event.stopPropagation();payments()">Evaluate</button></div>
</div>
<div class="actions"><button class="btn" onclick="step(2);render()">Back to Check User</button><button class="btn primary" onclick="step(4);render()">Create account</button></div>`; }
function modal(html){$('#modalbox').innerHTML=html;$('#modal').classList.remove('hidden')}function close(){ $('#modal').classList.add('hidden')}
function vault(){modal(`<span class="kicker">MY VALUE VAULT</span><h2>Connected value</h2><div class="list"><div class="card"><b>Memberships</b><span class="muted"> ${A.vault.memberships} connected</span></div><div class="card"><b>Reward Points</b><span class="muted"> ${A.vault.points}</span></div><div class="card"><b>Promocodes</b><span class="muted"> ${A.vault.promos}</span></div><div class="card"><b>Vouchers / Coupons</b><span class="muted"> ${A.vault.vouchers}</span></div></div><div class="actions"><button class="btn" onclick="toast('App connection approved');close()">Approve / Link App</button><button class="btn primary" onclick="close()">Done</button></div>`)}
function visiting(){modal(`<span class="kicker">MY VISITING CARD</span><h2>${A.card?'Active Card':'Add / Configure Card'}</h2><div class="field"><label>Name</label><input id="pn" value="${A.profile.name}"></div><div class="field"><label>Role / Profile</label><input id="pr" value="${A.profile.role}"></div><div class="field"><label>Phone</label><input id="pp" value="${A.profile.phone}"></div><div class="field"><label>Email</label><input id="pe" value="${A.profile.email}"></div><div class="field"><label>Company / Context</label><input id="pc" value="${A.profile.company}"></div><div class="actions"><button class="btn primary" onclick="saveCard()">Save Profile</button><button class="btn" onclick="shareCard()">Share</button></div>`)}
function saveCard(){A.profile={name:$('#pn').value,role:$('#pr').value,phone:$('#pp').value,email:$('#pe').value,company:$('#pc').value};A.card=true;save();toast('Card activated');close();render()}
function shareCard(){navigator.clipboard?.writeText('https://card.kanzpay.com/c/review-profile').catch(()=>{});toast('Share link copied / ready');}
function friends(){modal(`<span class="kicker">EARN WITH FRIENDS</span><h2>Share your journey</h2><p class="muted">Share a link by WhatsApp, SMS, email or copy link. Referral behaviour is represented here without changing the journey.</p><div class="actions"><button class="btn primary" onclick="shareCard();close()">Copy link</button><button class="btn" onclick="toast('Share sheet ready');close()">WhatsApp / SMS / Email</button></div>`)}
function gold(){modal(`<span class="kicker">MY GOLD VAULT</span><h2>${A.gold.toFixed(2)} mg</h2><p class="muted">Gold weight · current value context · +/- change versus acquisition.</p><div class="actions"><button class="btn" onclick="A.gold+=0.1;save();toast('Buy flow staged');close();render()">Buy</button><button class="btn" onclick="toast('Sell flow staged');close()">Sell</button><button class="btn" onclick="toast('Redeem flow staged');close()">Redeem</button><button class="btn" onclick="toast('Gift flow staged');close()">Gift</button><button class="btn primary" onclick="toast('Pay with Gold staged');close()">Pay with Gold</button></div>`)}
function expenses(){modal(`<span class="kicker">MY EXPENSES</span><h2>Category-wise expense intelligence</h2><p class="muted">Daily / Weekly / Monthly / Yearly progression.</p><div class="chart" style="height:180px"><i class="bar" style="height:44%"></i><i class="bar" style="height:72%"></i><i class="bar" style="height:58%"></i><i class="bar" style="height:86%"></i><i class="bar" style="height:51%"></i><i class="bar" style="height:64%"></i></div><div class="actions"><button class="btn primary" onclick="close()">Done</button></div>`)}
function payments(){modal(`<span class="kicker">PAYMENT INSTRUMENT INTELLIGENCE</span><h2>Evaluate instrument-wise offers & benefits</h2><div class="list"><div class="card"><b>Card</b><span class="muted"> Connected · offer available</span></div><div class="card"><b>Bank Account</b><span class="muted"> Connected · A2A eligible</span></div><div class="card" style="opacity:.5"><b>Other instrument</b><span class="muted"> Not connected · tap to activate</span></div></div><p class="muted">Recommendations are shown for user approval before applying any value-building logic.</p><div class="actions"><button class="btn primary" onclick="toast('Recommendation approved');close()">Approve</button><button class="btn" onclick="close()">Later</button></div>`)}
function account(){ $('#app').innerHTML=`
<section class="card"><span class="kicker">STEP 4 · CREATE ACCOUNT</span><h1>Create account</h1><p class="muted">Existing account creation flow: Emirates ID front + back, live camera guidance, document crop/edit, photo match and AML checks.</p><div class="grid"><div class="card"><h3>Emirates ID</h3><p class="muted">Upload front + back</p><button class="btn" onclick="toast('Upload staged')">Upload ID</button></div><div class="card"><h3>Live camera</h3><p class="muted">Blink · look left · look right · hold Emirates ID</p><button class="btn" onclick="camera()">Start camera</button></div><div class="card"><h3>Check</h3><p class="muted">Document crop/edit · photo match · AML check</p><button class="btn primary" onclick="finish()">Complete</button></div></div></section>`; }
function camera(){toast('Camera permission requested in the native build')}
function finish(){localStorage.setItem('kp_account','1');toast('Account flow completed in review mode')}
render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
