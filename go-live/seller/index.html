<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050705">
<title>KANZPAY — K-Assistant Seller Journey</title>
<style>
:root{--bg:#050705;--ink:#f6f1e5;--muted:#aaa59a;--gold:#c59a2e;--gold2:#f2d789;--line:rgba(242,215,137,.18)}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{overflow:hidden}button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#app{position:fixed;inset:0;overflow:hidden;background:radial-gradient(circle at 70% 7%,rgba(242,215,137,.09),transparent 27%),radial-gradient(circle at 8% 84%,rgba(82,116,91,.08),transparent 26%),linear-gradient(145deg,#080b08,#040604 72%,#070907)}
.shell{position:absolute;inset:0;width:min(1380px,100%);margin:auto;padding:17px 20px;display:flex;flex-direction:column}.top{min-height:37px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:14px;letter-spacing:.20em;font-weight:950}.brand span{color:var(--gold2)}.tiny{font-size:8px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}
.stage{flex:1;min-height:0;display:grid;grid-template-columns:220px 1fr 250px;gap:12px;margin-top:11px}.rail{display:flex;flex-direction:column;gap:9px}.side{padding:12px}.step{padding:10px;border-left:2px solid rgba(242,215,137,.1);font-size:9px;color:var(--muted)}.step.on{border-color:var(--gold2);color:var(--ink);background:rgba(242,215,137,.045)}.step strong{display:block;color:var(--ink);font-size:11px}
.main{min-width:0;min-height:0;overflow:hidden}.view{height:100%;overflow:hidden;animation:in .38s ease-out both}
.glass{position:relative;background:linear-gradient(145deg,rgba(255,255,255,.055),rgba(255,255,255,.012));border:1px solid var(--line);border-radius:24px;box-shadow:0 25px 75px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.03);backdrop-filter:blur(22px);overflow:hidden}.glass:after{content:"";position:absolute;inset:-50% -20%;background:linear-gradient(110deg,transparent 39%,rgba(255,255,255,.04) 49%,transparent 60%);transform:translateX(-60%) rotate(8deg);animation:sheen 10s ease-in-out infinite;pointer-events:none}
.hero{position:relative;min-height:180px;border:1px solid var(--line);border-radius:28px;overflow:hidden;background:#0a0d0a;box-shadow:0 28px 82px rgba(0,0,0,.46)}.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.45}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.84))}.heroCopy{position:absolute;left:20px;right:20px;bottom:17px;z-index:2}.eyebrow{font-size:8px;color:var(--gold2);letter-spacing:.2em;text-transform:uppercase;margin-bottom:7px}.hero h1{font-size:35px;line-height:.95;letter-spacing:-.055em;margin:0}.hero p{font-size:10px;line-height:1.45;color:#d0cdc4;margin:7px 0 0;max-width:690px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:10px}.choice{padding:13px;text-align:left;min-height:135px}.choice strong{display:block;font-size:14px;margin-top:15px}.choice span{display:block;font-size:9px;line-height:1.4;color:var(--muted);margin-top:4px}.ico{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;border:1px solid var(--line);background:rgba(242,215,137,.05);color:var(--gold2);font-size:18px}
.section{padding:12px;margin-top:10px}.metric{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.metric strong{font-size:16px}.sub{font-size:9px;line-height:1.45;color:var(--muted);margin-top:5px}
.ctaWrap{margin-top:10px}.cta{width:100%;padding:10px 13px;border-radius:15px;border:1px solid var(--line);background:rgba(255,255,255,.025);text-align:left;font-weight:900}.cta.primary{background:linear-gradient(135deg,#f9e5a0,#bd912a);color:#171308;border:0}.cta .label{display:block;font-size:11px}.cta small{display:block;font-size:8px;line-height:1.35;margin-top:3px;font-weight:650;opacity:.78}.cta.primary small{color:#4f3b09;opacity:.9}
.ruleGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:10px}.rule{padding:12px;min-height:116px}.rule strong{display:block;color:var(--gold2);font-size:14px}.rule span{display:block;font-size:8px;color:var(--muted);line-height:1.4;margin-top:5px}
.dashboard{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.dash{padding:13px;min-height:205px}.dash h3{margin:0;font-size:15px}.dash ul{margin:9px 0 0;padding-left:15px;font-size:9px;line-height:1.55;color:#d8d3c8}.dash li::marker{color:var(--gold2)}.dash p{font-size:9px;color:var(--muted);line-height:1.4}
.assistant{position:fixed;right:18px;bottom:17px;z-index:30;display:flex;align-items:flex-end;gap:8px}.bubble{max-width:330px;padding:10px 12px;border-radius:18px;background:rgba(14,17,14,.92);border:1px solid var(--line);box-shadow:0 18px 50px rgba(0,0,0,.44);backdrop-filter:blur(20px)}.bubble small{display:block;font-size:7px;letter-spacing:.15em;color:var(--gold2)}.bubble strong{display:block;font-size:11px;margin-top:3px}.bubble span{display:block;color:var(--muted);font-size:8px;line-height:1.35;margin-top:2px}.face{width:51px;height:51px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 25%,#f9e6a2,#a87823 42%,#49330c);border:1px solid rgba(242,215,137,.44);color:#3e2b08;font-weight:950;box-shadow:0 0 38px rgba(242,215,137,.2)}
.confetti{position:fixed;inset:0;z-index:100;pointer-events:none;overflow:hidden}.piece{position:absolute;width:8px;height:15px;border-radius:2px;animation:fall 1.8s cubic-bezier(.2,.8,.2,1) forwards}.toast{position:fixed;left:50%;bottom:22px;z-index:90;transform:translate(-50%,10px);padding:9px 12px;border-radius:12px;background:rgba(14,17,14,.95);border:1px solid var(--line);font-size:9px;color:var(--gold2);opacity:0;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
@keyframes in{from{opacity:0;transform:translateY(9px) scale(.99)}to{opacity:1;transform:none}}@keyframes sheen{0%,60%{transform:translateX(-65%) rotate(8deg)}85%,100%{transform:translateX(60%) rotate(8deg)}}@keyframes fall{from{transform:translate3d(0,-10vh,0) rotate(0);opacity:1}to{transform:translate3d(var(--x),110vh,0) rotate(680deg);opacity:0}}
@media(max-width:1050px){.stage{grid-template-columns:1fr}.rail{display:none}.dashboard{grid-template-columns:1fr 1fr}.ruleGrid,.grid4{grid-template-columns:1fr 1fr}}@media(max-width:700px){.shell{padding:12px}.dashboard,.grid2,.grid3,.grid4,.ruleGrid{grid-template-columns:1fr}.hero h1{font-size:30px}}
.flowMark{display:flex;align-items:center;gap:8px;margin:4px 0 9px;padding:6px 8px;border:1px solid rgba(242,215,137,.13);border-radius:12px;background:rgba(242,215,137,.025)}.flowMark b{font-size:8px;color:#171308;background:linear-gradient(135deg,#f7e29b,#bb8e27);padding:4px 7px;border-radius:8px}.flowMark span{font-size:7px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}.flowMark em{margin-left:auto;font-size:7px;font-style:normal;color:var(--gold2);letter-spacing:.1em}</style>
</head>
<body>
<div id="app"><div class="shell"><div class="top"><div class="brand">KANZ<span>PAY</span> <b>K-ASSISTANT · SELLER</b></div><span class="tiny">Windows · Mac · Linux · Android</span></div><div id="flowMark"></div>
<div class="stage"><aside class="rail"><div class="glass side"><div class="tiny">SELLER JOURNEY</div><div id="steps"></div></div><div class="glass side"><div class="tiny">Companion</div><div class="sub">K-Assistant stays in the background and becomes the dashboard trigger after setup.</div></div></aside><main class="main"><div class="view" id="view"></div></main></div>
<div class="assistant"><div class="bubble"><small>K-ASSISTANT</small><strong id="at"></strong><span id="ab"></span></div><button class="face" onclick="toast('K-Assistant is staying with the seller')">K</button></div>
<div class="toast" id="toast"></div><div class="confetti" id="confetti"></div></div></div>
<script>const FLOW={"start":{"n":"1","t":"Start Onboarding","e":"Show","p":"Tap link to begin.","img":"store","o":[["Tap link","installAssistant"]]},"installAssistant":{"n":"1","t":"Install K-Assistant (in background), Choose business type, Lat-Long, Logo, Pics","e":"Action","p":"Business type, Lat-Long, Logo, Pics.","img":"people","items":["Choose business type","Lat-Long","Logo","Pics"],"o":[["Tap link","sampleInvoice"]]},"sampleInvoice":{"n":"1","t":"Sample Share Invoice to K-Assistant, Correct Shop name, address, VAT, Mob No.","e":"Check","p":"Correct Shop name, address, VAT, Mob No.","img":"invoice","items":["Shop name","address","VAT","Mob No."],"o":[["Install K-Tag","installKTag"]]},"installKTag":{"n":"1","t":"Identify system (windows, Mac, Linux, Android etc(, install drivers, align patch, create floating K-Assistant (KanzPay Logo)","e":"Action","p":"Identify system, install drivers, align patch, create floating K-Assistant (KanzPay Logo).","img":"pos","items":["windows","Mac","Linux","Android etc","install drivers","align patch","create floating K-Assistant (KanzPay Logo)"],"o":[["Set Reward Rules","rewardRules"]]},"rewardRules":{"n":"Result","t":"Set Reward Rules","e":"Result","p":"GMV_AED = Points = DISC_AED · Points = Free Product milestones · Gold = GMV_AED Slabs = % Gold.","img":"gold","items":["GMV_AED = Points = DISC_AED","Points = Free Product milestones","Gold = GMV_AED Slabs = % Gold"],"o":[["K-Assistant Value Pop up → Vault shared","vaultShared"]],"celebrate":true},"vaultShared":{"n":"2","t":"K-Assistant Value Pop up — Vault shared","e":"Decision","p":"No or Yes.","img":"vault","o":[["No → Generate Invoice","generateInvoice"],["Yes → Adjust","adjust"]]},"adjust":{"n":"Yes","t":"Adjust","e":"Action","p":"Membership Discounts(%) value, Voucher / Promo codes value, Coupons value, Reward points value, Free gift.","img":"vault","items":["Membership Discounts(%) value","Voucher / Promo codes value","Coupons value","Reward points value","Free gift"],"o":[["Generate Invoice","generateInvoice"]]},"generateInvoice":{"n":"2","t":"Generate Invoice","e":"Action","p":"Generate the invoice.","img":"invoice","o":[["Share Invoice (Print – K-Assist.)","shareInvoice"]]},"shareInvoice":{"n":"2","t":"Share Invoice (Print – K-Assist.)","e":"Result","p":"Share through Print – K-Assist.","img":"invoice","o":[["Dashboard trigger from A-Assit Logo","dashboard"]],"celebrate":true},"dashboard":{"n":"3","t":"Dashboard trigger from A-Assit Logo (All-Store wise drop down)","e":"Show","p":"All-Store wise drop down.","img":"store","items":["All-Store wise drop down"],"o":[["Focus","focus"],["Intelligence","intelligence"]]},"focus":{"n":"3","t":"Focus","e":"Action","p":"Transaction Commission, Tickets, Rewards, Trends vs last period, Customer trends.","img":"people","items":["Transaction Commission","Pending requests","Paid History","Tickets","Complaints","Queries","Ratings","Rewards","benefits – repeat cust.","Gold = %of Bill Value","Rules edit","Trends vs last period","Value trends","Volume trend","Customer trends","Walkin","Avg ticket size","Repeat customer%"],"o":[]},"intelligence":{"n":"3","t":"Intelligence","e":"Action","p":"Catalogue, Inventory, Finance, Payment Instruments.","img":"catalog","items":["Catalogue","Editable Menu page","Competition price SKU","Menu Templates","Inventory","Low stock sku list +/-","High stock sku list +/-","Finance","Payables Val/Vol/list","Receivables V/V/L (“)","P&L","Balance sheet","Payment Instruments","Cards","Account to Account","Settlement","View txns cycle/mth/year","Change plan"],"o":[]}};const IMG={"life":"https://images.unsplash.com/photo-1529156069898-49953e39b3ac?auto=format&fit=crop&w=1200&q=84","store":"https://images.unsplash.com/photo-1472851294608-062f824d29cc?auto=format&fit=crop&w=1200&q=84","people":"https://images.unsplash.com/photo-1521737711867-e3b97375f902?auto=format&fit=crop&w=1200&q=84","phone":"https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&w=1200&q=84","scan":"https://images.unsplash.com/photo-1556742049-0cfed4f6a45d?auto=format&fit=crop&w=1200&q=84","invoice":"https://images.unsplash.com/photo-1554224155-8d04cb21cd6c?auto=format&fit=crop&w=1200&q=84","vault":"https://images.unsplash.com/photo-1556761175-b413da4baf72?auto=format&fit=crop&w=1200&q=84","gold":"https://images.unsplash.com/photo-1610375461246-83df859d849d?auto=format&fit=crop&w=1200&q=84","card":"https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=1200&q=84","money":"https://images.unsplash.com/photo-1554224155-8d04cb21cd6c?auto=format&fit=crop&w=1200&q=84","pay":"https://images.unsplash.com/photo-1556742049-0cfed4f6a45d?auto=format&fit=crop&w=1200&q=84","id":"https://images.unsplash.com/photo-1544084944-15269ec7b5a0?auto=format&fit=crop&w=1200&q=84","camera":"https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=1200&q=84","catalog":"https://images.unsplash.com/photo-1556740749-887f6717d7e4?auto=format&fit=crop&w=1200&q=84","pos":"https://images.unsplash.com/photo-1556742049-0cfed4f6a45d?auto=format&fit=crop&w=1200&q=84","qr":"https://images.unsplash.com/photo-1556742049-0cfed4f6a45d?auto=format&fit=crop&w=1200&q=84"};const START='start';const MOT={"start":["I’m setting up the shop.","I’ll keep the K-Assistant in the background."],"vaultShared":["One seller decision matters here.","No goes straight to invoice. Yes adjusts the shared value first."],"dashboard":["The assistant becomes your trigger.","All-Store wise, then Focus or Intelligence."],"focus":["Focus is the operating pulse.","Transactions, tickets, rewards and customer trends."],"intelligence":["Intelligence is the growth layer.","Catalogue, inventory, finance and payment instruments."]};
let state={id:START,history:[]};
function el(id){return document.getElementById(id)}
function go(id){if(!FLOW[id])return;state.history.push(state.id);state.id=id;render()}
function back(){state.id=state.history.pop()||START;render()}
function toast(t){const x=el('toast');x.textContent=t;x.classList.add('show');clearTimeout(window._toast);window._toast=setTimeout(()=>x.classList.remove('show'),1500)}
function celebrate(){const box=el('confetti');box.innerHTML='';for(let i=0;i<64;i++){const d=document.createElement('i');d.className='piece';d.style.left=(44+Math.random()*12)+'%';d.style.setProperty('--x',((Math.random()-.5)*86)+'vw');d.style.background=['#f2d789','#fff0b5','#9fc8a7','#d2a43b','#fff'][i%5];d.style.animationDelay=(Math.random()*.25)+'s';box.appendChild(d)}setTimeout(()=>box.innerHTML='',2200)}
function icon(label){if(label.includes('Tap'))return '◉';if(label.includes('Scan')||label.includes('QR'))return '⌁';if(label.includes('Gold'))return 'Au';if(label.includes('Card'))return 'C';if(label.includes('Value'))return 'V';if(label.includes('Create')||label.includes('Emirates'))return 'ID';if(label.includes('User'))return '◌';return '•'}
function benefit(label){const map={'Tap':'Start the journey immediately.','Scan':'Start from the camera URL link.','Existing User':'Keep the existing account context.','New User':'Begin the new-user path.','Yes':'Continue on the Yes branch shown in the flow.','No':'Continue on the No branch shown in the flow.','Cockpit':'Return to the six-module view.','Back to Cockpit':'Return without changing the flow.','Create account':'Secure the connected value layer.','All Set to Earn more':'Move into the numbered Create account step.'};return map[label]||'Continue exactly along this flow node.'}
function mark(n){return '<div class="mark"><b>'+n.n+'</b><span>'+n.t+'</span><em>'+n.e+'</em></div>'}
function hero(n){return '<div class="hero"><img src="'+(IMG[n.img]||IMG.life)+'"><div class="heroText"><div class="eyebrow">'+n.e+'</div><h1>'+n.t+'</h1><p>'+n.p+'</p></div></div>'}
function items(n){if(!n.items||!n.items.length)return '';return '<div class="rail">'+n.items.map((x,i)=>'<div class="glass tile"><strong>'+x+'</strong><span>'+((i<4)?'Part of this exact flow node':'Flow detail')+'</span><b>'+(n.e==='Module'?'MODULE':'STEP')+'</b></div>').join('')+'</div>'}
function choice(label,next){return '<button class="glass node" onclick="go(\''+next+'\')"><div class="ico">'+icon(label)+'</div><strong>'+label+'</strong><span>Benefit: '+benefit(label)+'</span></button>'}
function cockpit(n){return '<div class="grid2">'+n.o.map(x=>choice(x[0],x[1])).join('')+'</div>'}
function extra(n){let h='';if(n.t==='My Visiting Card')h+='<div class="cardHero"><img src="'+IMG.card+'"><div class="cardCopy"><div class="cardBrand">KANZPAY CONNECT</div><div><div class="cardName">Selected profile</div><div class="sub">Glass · image · metallic gold</div></div><div><span class="tag">NFC</span> <span class="tag">QR</span> <span class="tag">Share</span></div></div></div>';if(n.t==='My Gold Vault')h+='<div class="goldHero"><div class="coin">Au</div><div class="goldCopy"><strong>Gold</strong><span>Weight · +/- % vs purchase</span></div></div>';if(n.t==='My Expenses')h+='<div class="glass chart"><i class="bar" style="height:36%"></i><i class="bar" style="height:52%"></i><i class="bar" style="height:46%"></i><i class="bar" style="height:72%"></i><i class="bar" style="height:59%"></i><i class="bar" style="height:87%"></i></div><div class="pie"></div>';if(n.t==='Payment instrument intelligence inbuilt')h+='<div class="rail"><div class="glass instrument"><span>Cards BIN info</span><strong>Offers</strong><b>READY</b></div><div class="glass instrument"><span>Lean AIS</span><strong>Instrument intelligence</strong><b>READY</b></div></div>';if(n.t==='Create account')h+='<div class="checks"><div class="glass panel"><b>1</b><span>Emirates ID</span></div><div class="glass panel"><b>2</b><span>Live Camera</span></div><div class="glass panel"><b>3</b><span>Photo Match</span></div><div class="glass panel"><b>4</b><span>AML</span></div></div>';if(n.t.includes('Live camera'))h+='<div class="camera"><img src="'+IMG.camera+'"><i class="dot" style="left:39%;top:36%"></i><i class="dot" style="left:57%;top:36%"></i><i class="dot" style="left:48%;top:57%"></i></div>';if(n.t.includes('Emirates ID')&&n.t.includes('front'))h+='<div class="idCard"><div class="idLines"><i style="width:80%"></i><i style="width:64%"></i><i style="width:90%"></i></div></div>';if(n.t==='Payment instrument intelligence inbuilt')h+='<div class="glass panel"><div class="metric"><strong>Recommendation</strong><span class="tiny">User approval</span></div><div class="sub">Evaluate instrument wise offers, benefits → Get user approval for recommendation logic.</div></div>';return h}
function render(){const n=FLOW[state.id];const m=MOT[state.id]||['I’m here with you.','I’ll keep the exact supplied flow in view.'];el('at').textContent=m[0];el('ab').textContent=m[1];el('assistant').classList.add('open');clearTimeout(window._a);window._a=setTimeout(()=>el('assistant').classList.remove('open'),4800);el('top').innerHTML=(state.history.length?'<button style="font-size:8px;color:var(--muted)" onclick="back()">‹ Back</button>':'<div class="brand">KANZ<span>PAY</span></div>')+'<span class="tiny">SELLER · EXACT PDF FLOW</span>';if(n.celebrate)celebrate();let h=mark(n)+hero(n)+extra(n)+items(n);if(state.id==='cockpit')h+=cockpit(n);else if(n.o&&n.o.length)h+='<div class="grid2">'+n.o.map(x=>choice(x[0],x[1])).join('')+'</div>';else if(n.e==='Module')h+='<div class="ctaWrap"><button class="cta primary" onclick="back()"><b>Back to Cockpit</b><small>Benefit: return without altering the supplied flow.</small></button></div>';el('stage').innerHTML='<div class="scene">'+h+'</div>'}
render();</script></body></html>
