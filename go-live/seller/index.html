<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050705">
<title>KANZPAY — K-Assistant Seller Journey</title>
<style>
:root{--bg:#050705;--ink:#f6f1e5;--muted:#aaa59a;--gold:#c59a2e;--gold2:#f2d789;--line:rgba(242,215,137,.18)}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{overflow:hidden}button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#app{position:fixed;inset:0;overflow:hidden;background:radial-gradient(circle at 70% 7%,rgba(242,215,137,.09),transparent 27%),radial-gradient(circle at 8% 84%,rgba(82,116,91,.08),transparent 26%),linear-gradient(145deg,#080b08,#040604 72%,#070907)}
.shell{position:absolute;inset:0;width:min(1380px,100%);margin:auto;padding:17px 20px;display:flex;flex-direction:column}.top{min-height:37px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:14px;letter-spacing:.20em;font-weight:950}.brand span{color:var(--gold2)}.tiny{font-size:8px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}
.stage{flex:1;min-height:0;display:grid;grid-template-columns:220px 1fr 250px;gap:12px;margin-top:11px}.rail{display:flex;flex-direction:column;gap:9px}.side{padding:12px}.step{padding:10px;border-left:2px solid rgba(242,215,137,.1);font-size:9px;color:var(--muted)}.step.on{border-color:var(--gold2);color:var(--ink);background:rgba(242,215,137,.045)}.step strong{display:block;color:var(--ink);font-size:11px}
.main{min-width:0;min-height:0;overflow:hidden}.view{height:100%;overflow:hidden;animation:in .38s ease-out both}
.glass{position:relative;background:linear-gradient(145deg,rgba(255,255,255,.055),rgba(255,255,255,.012));border:1px solid var(--line);border-radius:24px;box-shadow:0 25px 75px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.03);backdrop-filter:blur(22px);overflow:hidden}.glass:after{content:"";position:absolute;inset:-50% -20%;background:linear-gradient(110deg,transparent 39%,rgba(255,255,255,.04) 49%,transparent 60%);transform:translateX(-60%) rotate(8deg);animation:sheen 10s ease-in-out infinite;pointer-events:none}
.hero{position:relative;min-height:180px;border:1px solid var(--line);border-radius:28px;overflow:hidden;background:#0a0d0a;box-shadow:0 28px 82px rgba(0,0,0,.46)}.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.45}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.84))}.heroCopy{position:absolute;left:20px;right:20px;bottom:17px;z-index:2}.eyebrow{font-size:8px;color:var(--gold2);letter-spacing:.2em;text-transform:uppercase;margin-bottom:7px}.hero h1{font-size:35px;line-height:.95;letter-spacing:-.055em;margin:0}.hero p{font-size:10px;line-height:1.45;color:#d0cdc4;margin:7px 0 0;max-width:690px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:10px}.choice{padding:13px;text-align:left;min-height:135px}.choice strong{display:block;font-size:14px;margin-top:15px}.choice span{display:block;font-size:9px;line-height:1.4;color:var(--muted);margin-top:4px}.ico{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;border:1px solid var(--line);background:rgba(242,215,137,.05);color:var(--gold2);font-size:18px}
.section{padding:12px;margin-top:10px}.metric{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.metric strong{font-size:16px}.sub{font-size:9px;line-height:1.45;color:var(--muted);margin-top:5px}
.ctaWrap{margin-top:10px}.cta{width:100%;padding:10px 13px;border-radius:15px;border:1px solid var(--line);background:rgba(255,255,255,.025);text-align:left;font-weight:900}.cta.primary{background:linear-gradient(135deg,#f9e5a0,#bd912a);color:#171308;border:0}.cta .label{display:block;font-size:11px}.cta small{display:block;font-size:8px;line-height:1.35;margin-top:3px;font-weight:650;opacity:.78}.cta.primary small{color:#4f3b09;opacity:.9}
.ruleGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:10px}.rule{padding:12px;min-height:116px}.rule strong{display:block;color:var(--gold2);font-size:14px}.rule span{display:block;font-size:8px;color:var(--muted);line-height:1.4;margin-top:5px}
.dashboard{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.dash{padding:13px;min-height:205px}.dash h3{margin:0;font-size:15px}.dash ul{margin:9px 0 0;padding-left:15px;font-size:9px;line-height:1.55;color:#d8d3c8}.dash li::marker{color:var(--gold2)}.dash p{font-size:9px;color:var(--muted);line-height:1.4}
.assistant{position:fixed;right:18px;bottom:17px;z-index:30;display:flex;align-items:flex-end;gap:8px}.bubble{max-width:330px;padding:10px 12px;border-radius:18px;background:rgba(14,17,14,.92);border:1px solid var(--line);box-shadow:0 18px 50px rgba(0,0,0,.44);backdrop-filter:blur(20px)}.bubble small{display:block;font-size:7px;letter-spacing:.15em;color:var(--gold2)}.bubble strong{display:block;font-size:11px;margin-top:3px}.bubble span{display:block;color:var(--muted);font-size:8px;line-height:1.35;margin-top:2px}.face{width:51px;height:51px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 25%,#f9e6a2,#a87823 42%,#49330c);border:1px solid rgba(242,215,137,.44);color:#3e2b08;font-weight:950;box-shadow:0 0 38px rgba(242,215,137,.2)}
.confetti{position:fixed;inset:0;z-index:100;pointer-events:none;overflow:hidden}.piece{position:absolute;width:8px;height:15px;border-radius:2px;animation:fall 1.8s cubic-bezier(.2,.8,.2,1) forwards}.toast{position:fixed;left:50%;bottom:22px;z-index:90;transform:translate(-50%,10px);padding:9px 12px;border-radius:12px;background:rgba(14,17,14,.95);border:1px solid var(--line);font-size:9px;color:var(--gold2);opacity:0;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
@keyframes in{from{opacity:0;transform:translateY(9px) scale(.99)}to{opacity:1;transform:none}}@keyframes sheen{0%,60%{transform:translateX(-65%) rotate(8deg)}85%,100%{transform:translateX(60%) rotate(8deg)}}@keyframes fall{from{transform:translate3d(0,-10vh,0) rotate(0);opacity:1}to{transform:translate3d(var(--x),110vh,0) rotate(680deg);opacity:0}}
@media(max-width:1050px){.stage{grid-template-columns:1fr}.rail{display:none}.dashboard{grid-template-columns:1fr 1fr}.ruleGrid,.grid4{grid-template-columns:1fr 1fr}}@media(max-width:700px){.shell{padding:12px}.dashboard,.grid2,.grid3,.grid4,.ruleGrid{grid-template-columns:1fr}.hero h1{font-size:30px}}
.flowMark{display:flex;align-items:center;gap:8px;margin:4px 0 9px;padding:6px 8px;border:1px solid rgba(242,215,137,.13);border-radius:12px;background:rgba(242,215,137,.025)}.flowMark b{font-size:8px;color:#171308;background:linear-gradient(135deg,#f7e29b,#bb8e27);padding:4px 7px;border-radius:8px}.flowMark span{font-size:7px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}.flowMark em{margin-left:auto;font-size:7px;font-style:normal;color:var(--gold2);letter-spacing:.1em}</style>
</head>
<body>
<div id="app"><div class="shell"><div class="top"><div class="brand">KANZ<span>PAY</span> <b>K-ASSISTANT · SELLER</b></div><span class="tiny">Windows · Mac · Linux · Android</span></div>
<div class="stage"><aside class="rail"><div class="glass side"><div class="tiny">SELLER JOURNEY</div><div id="steps"></div></div><div class="glass side"><div class="tiny">Companion</div><div class="sub">K-Assistant stays in the background and becomes the dashboard trigger after setup.</div></div></aside><main class="main"><div class="view" id="view"></div></main></div>
<div class="assistant"><div class="bubble"><small>K-ASSISTANT</small><strong id="at"></strong><span id="ab"></span></div><button class="face" onclick="toast('K-Assistant is staying with the seller')">K</button></div>
<div class="toast" id="toast"></div><div class="confetti" id="confetti"></div></div></div>
<script>
const flowNames={onboard:["1","START ONBOARDING","SHOW"],setup:["1","INSTALL K-ASSISTANT (IN BACKGROUND)","ACTION"],system:["1","IDENTIFY SYSTEM / K-TAG","ACTION"],sample:["CHECK","SAMPLE SHARE INVOICE","CHECK"],rules:["RESULT","SET REWARD RULES","RESULT"],vault:["2","VALUE VAULT SHARED?","DECISION"],adjust:["YES","ADJUST VALUE","ACTION"],generate:["2","GENERATE INVOICE","ACTION"],share:["2","SHARE INVOICE (PRINT - K-ASSIST.)","ACTION"],dashboard:["3","DASHBOARD TRIGGER FROM A-ASSIST LOGO","SHOW"],focus:["3","FOCUS","ACTION"],intelligence:["3","INTELLIGENCE","ACTION"],done:["RESULT","SELLER JOURNEY COMPLETE","RESULT"]};
const S={step:"onboard",history:[],system:"Windows",vaultShared:null};
const img={store:"https://images.unsplash.com/photo-1472851294608-062f824d29cc?auto=format&fit=crop&w=1200&q=84",people:"https://images.unsplash.com/photo-1556761175-b413da4baf72?auto=format&fit=crop&w=1200&q=84",pos:"https://images.unsplash.com/photo-1556742049-0cfed4f6a45d?auto=format&fit=crop&w=1200&q=84",catalog:"https://images.unsplash.com/photo-1556740749-887f6717d7e4?auto=format&fit=crop&w=1200&q=84",gold:"https://images.unsplash.com/photo-1610375461246-83df859d849d?auto=format&fit=crop&w=1200&q=84"};
const msg={onboard:["I’m setting up the shop.","Start here. I’ll stay in the background once K-Assistant is installed."],setup:["Let’s make the shop recognisable.","Business type, Lat-Long, logo and pictures become the seller identity."],system:["I’ll fit the bridge to the system.","Windows, Mac, Linux and Android each get their K-Tag path."],sample:["Let’s test one real invoice.","Shop name, address, VAT and mobile must arrive correctly before live use."],rules:["Now define the value.","These rules control points, discounts, free-product milestones and Gold."],vault:["One seller decision.","The K-Assistant popup asks whether the buyer Value Vault is shared."],adjust:["Use the shared value carefully.","Membership discount, voucher/coupon value, reward points and free gift feed the invoice."],generate:["The invoice is the bridge.","Generate it after the Value Vault decision and reward rules are known."],share:["Now the invoice can travel.","Print / K-Assist share connects the seller transaction to the buyer journey."],dashboard:["The floating logo becomes the trigger.","All-store dropdown first, then Focus or Intelligence."],focus:["Focus is the operating pulse.","Commission, tickets, rewards, Gold, trends and customer trends sit here."],intelligence:["Intelligence is the growth layer.","Catalogue, inventory, finance and payment instruments connect the store."],done:["Mabrook.","The exact seller sequence is configured end to end."]};
function topHero(ey,t,c,p){return '<div class="hero"><img src="'+p+'"><div class="heroCopy"><div class="eyebrow">'+ey+'</div><h1>'+t+'</h1><p>'+c+'</p></div></div>'}
function section(t,sub,b){return '<div class="glass section"><div class="metric"><strong>'+t+'</strong><span class="tiny">'+sub+'</span></div><div class="sub">'+b+'</div></div>'}
function cta(label,benefit,fn,primary=true){return '<div class="ctaWrap"><button class="cta '+(primary?'primary':'')+'" onclick="'+fn+'"><span class="label">'+label+'</span><small>Benefit: '+benefit+'</small></button></div>'}
function choice(t,sub,ic,fn){return '<button class="glass choice" onclick="'+fn+'"><div class="ico">'+ic+'</div><strong>'+t+'</strong><span>'+sub+'</span></button>'}
function toast(t){const x=document.getElementById("toast");x.textContent=t;x.classList.add("show");clearTimeout(window._t);window._t=setTimeout(()=>x.classList.remove("show"),1500)}
function celebrate(){const box=document.getElementById("confetti");box.innerHTML="";for(let i=0;i<66;i++){const d=document.createElement("i");d.className="piece";d.style.left=(44+Math.random()*12)+"%";d.style.setProperty("--x",((Math.random()-.5)*88)+"vw");d.style.background=["#f2d789","#fff0b5","#9fc8a7","#d2a43b","#fff"][i%5];d.style.animationDelay=(Math.random()*.25)+"s";box.appendChild(d)}setTimeout(()=>box.innerHTML="",2100)}
function setA(){const m=msg[S.step]||msg.onboard;document.getElementById("at").textContent=m[0];document.getElementById("ab").textContent=m[1];const f=flowNames[S.step]||["","",""];document.getElementById("flowMark").innerHTML="<div class=\"flowMark\"><b>"+f[0]+"</b><span>"+f[1]+"</span><em>"+f[2]+"</em></div>";}
function go(n){if(n!==S.step)S.history.push(S.step);S.step=n;render()}function back(){S.step=S.history.pop()||"onboard";render()}
const steps=[["1","Start Onboarding","onboard"],["1","Install K-Assistant","setup"],["1","Identify System / K-Tag","system"],["1","Sample Share Invoice","sample"],["Result","Set Reward Rules","rules"],["2","Value Vault Shared?","vault"],["3","A-Assist Dashboard","dashboard"]];
function renderSteps(){document.getElementById("steps").innerHTML=steps.map(a=>'<div class="step '+(S.step===a[2]?'on':'')+'"><strong>'+a[0]+' · '+a[1]+'</strong></div>').join("")}
function render(){
setA();renderSteps();const s=S.step,v=document.getElementById("view");
if(s==="onboard"){v.innerHTML=topHero("Step 1","Start Onboarding","Tap link to begin the exact seller setup. K-Assistant will remain in the background.",img.store)+section("Start Onboarding","SHOW","Tap link → Install K-Assistant → choose business type, Lat-Long, logo, pictures.")+cta("Start Onboarding","Set the seller identity before installing the operational bridge.","go(\'setup\')");return}
if(s==="setup"){v.innerHTML=topHero("Step 1 · Action","Install K-Assistant (in background)","Choose Business Type, Lat-Long, Logo and Pics. The assistant becomes persistent after setup.",img.people)+section("Business type","ACTION","Retail / Gifts · Grand Gifts") + section("Lat-Long","LOCATION","25.20° N · 55.27° E") + section("Logo + Pics","IDENTITY","Grand Gifts logo · storefront · products · team") + cta("Install K-Tag","Move into system identification while K-Assistant stays in the background.","go(\'system\');celebrate()");return}
if(s==="system"){v.innerHTML=topHero("Install K-Tag","Identify system","Windows, Mac, Linux, Android → install drivers → align patch → create floating K-Assistant (KanzPay Logo).",img.pos)+'<div class="grid4">'+["Windows","Mac","Linux","Android"].map(x=>choice(x,S.system===x?"Selected · drivers + patch":"Select system",x[0],"S.system='"+x+"';render()")).join("")+'</div>'+section("K-Tag","ACTION","Install drivers · align print patch · create floating K-Assistant (KanzPay Logo).")+cta("Check K-Tag setup","Make invoice capture ready on the selected seller system.","go(\'sample\');celebrate()");return}
if(s==="sample"){v.innerHTML=topHero("Check","Sample Share Invoice to K-Assistant","Share one sample invoice to K-Assistant and correct the Shop Name, Address, VAT and Mob No.",img.pos)+section("Shop Name","CHECK","Grand Gifts") + section("Address","CHECK","Al Maryah · Abu Dhabi") + section("VAT","CHECK","TRN · 1000••••••") + section("Mob No.","CHECK","+971 •• ••• ••••") + cta("Correct & Confirm","Prevent seller identity errors before reward rules are made live.","go(\'rules\');celebrate()");return}
if(s==="rules"){v.innerHTML=topHero("Result","Set Reward Rules","The seller rules shown in the diagram become the invoice engine.",img.gold)+'<div class="ruleGrid"><div class="glass rule"><strong>GMV_AED</strong><span>Bill value becomes the base.</span></div><div class="glass rule"><strong>Points = GMV_AED</strong><span>Points map to discount value.</span></div><div class="glass rule"><strong>Points = Free Product</strong><span>Milestones unlock free-product benefits.</span></div><div class="glass rule"><strong>Gold = GMV_AED slabs = % Gold</strong><span>Gold follows the defined bill slabs.</span></div></div>'+section("Seller rule set","RESULT","GMV_AED = Points = DISC_AED · Points = Free Product milestones · Gold = GMV_AED slabs = % Gold.")+cta("Save Reward Rules","Make every generated invoice use the same seller value logic.","go(\'vault\');celebrate()");return}
if(s==="vault"){v.innerHTML=topHero("Step 2","K-Assistant Pop-up · Value Vault shared?","The seller popup has exactly two paths: No → Generate Invoice. Yes → Adjust value, then Generate Invoice.",img.catalog)+'<div class="grid2">'+choice("No","Value Vault not shared → Generate Invoice.","No","S.vaultShared=false;go(\'generate\')")+choice("Yes","Value Vault shared → Adjust seller-side value inputs.","Yes","S.vaultShared=true;go(\'adjust\')")+'</div>';return}
if(s==="adjust"){v.innerHTML=topHero("Step 2 · Shared","Adjust Value Vault-linked Value","Adjust Membership Discounts(%) value · Voucher / Coupon value · Coupons value · Reward points value · Free gift.",img.catalog)+section("Membership Discounts(%)","VALUE","Adjust the allowed membership discount percentage.") + section("Voucher / Coupon","VALUE","Adjust voucher / coupon value available to the invoice.") + section("Reward Points","VALUE","Adjust reward points value for this basket.") + section("Free Gift","VALUE","Apply the free-gift milestone where qualified.") + cta("Generate Invoice","Carry the approved shared value into the seller invoice.","go(\'generate\')");return}
if(s==="generate"){v.innerHTML=topHero("Step 2 · Invoice","Generate Invoice","Generate the invoice after the exact Value Vault branch. This is the bridge into K-Assistant share.",img.pos)+section("Invoice engine","READY","Reward rules + basket + adjusted shared value (when available) produce the invoice.")+cta("Generate Invoice","Create one consistent transaction document for Print / K-Assist share.","go(\'share\');celebrate()");return}
if(s==="share"){v.innerHTML=topHero("Step 2 · Share","Share Invoice (Print – K-Assist.)","Print / share through K-Assistant. The floating assistant is the bridge between seller POS and buyer transaction.",img.pos)+'<div class="grid3"><div class="glass section"><strong>Paid</strong><div class="sub">Mabrook.</div></div><div class="glass section"><strong>In-Process</strong><div class="sub">Check if buyer needs help.</div></div><div class="glass section"><strong>Pending / Rejected</strong><div class="sub">Await action / ask buyer or reason.</div></div></div>'+cta("Open Dashboard Trigger","Move to Step 3 through the A-Assist floating logo.","go(\'dashboard\')");return}
if(s==="dashboard"){v.innerHTML=topHero("Step 3","Dashboard trigger from A-Assist Logo","All-Store wise dropdown comes first. Then Focus and Intelligence are the two exact branches.",img.store)+section("All-Store wise dropdown","SHOW","All Stores · Grand Gifts · Store 02 · Store 03")+'<div class="grid2">'+choice("Focus","Transaction Commission · Tickets · Rewards · Trends · Customer Trends.","F","go(\'focus\')")+choice("Intelligence","Catalogue · Inventory · Finance · Payment Instruments.","I","go(\'intelligence\')")+'</div>'+cta("Open Focus","Enter the operational pulse from the A-Assist logo.","go(\'focus\');celebrate()");return}
if(s==="focus"){v.innerHTML=topHero("Step 3 · Focus","Transaction + Customer Focus","Everything shown in the left Step 3 Focus box.",img.people)+'<div class="dashboard"><div class="glass dash"><h3>Transaction Commission</h3><ul><li>Pending requests</li><li>Paid History</li></ul><p>Track commission through the transaction cycle.</p></div><div class="glass dash"><h3>Tickets</h3><ul><li>Complaints</li><li>Queries</li><li>Ratings</li></ul><p>Customer issues stay visible.</p></div><div class="glass dash"><h3>Rewards</h3><ul><li>Benefits – repeat customer</li><li>Gold = % of Bill Value</li><li>Rules edit</li></ul><p>Value returned to the behaviours the seller wants.</p></div><div class="glass dash"><h3>Trends vs last period</h3><ul><li>Value trends</li><li>Volume trend</li></ul><p>Commercial movement over the prior period.</p></div><div class="glass dash"><h3>Customer trends</h3><ul><li>Walkin</li><li>Avg ticket size</li><li>Repeat customer %</li></ul><p>Understand customer quality, not just volume.</p></div><div class="glass dash"><h3>Rules + Gold</h3><ul><li>Gold = % of Bill Value</li><li>Rules edit</li></ul><p>Keep the seller reward model adjustable.</p></div></div>'+cta("Open Intelligence","Move into Catalogue, Inventory, Finance and Payment Instruments without losing the seller context.","go(\'intelligence\')");return}
if(s==="intelligence"){v.innerHTML=topHero("Step 3 · Intelligence","Catalogue + Inventory + Finance + Payment Instruments","Everything shown in the right Step 3 Intelligence box.",img.catalog)+'<div class="dashboard"><div class="glass dash"><h3>Catalogue</h3><ul><li>Editable Menu page</li><li>Competition price SKU</li><li>Menu Templates</li></ul><p>Keep the catalogue editable and competitive.</p></div><div class="glass dash"><h3>Inventory</h3><ul><li>Low stock SKU +/-</li><li>High stock SKU +/-</li></ul><p>Monitor SKU movement directly beside the catalogue.</p></div><div class="glass dash"><h3>Finance</h3><ul><li>Payables Val/Vol/list</li><li>Receivables V/V/L</li><li>P&amp;L</li><li>Balance sheet</li></ul><p>See business financial health.</p></div><div class="glass dash"><h3>Payment Instruments</h3><ul><li>Cards</li><li>Account to Account</li><li>Settlement</li><li>View txns cycle / mth / year</li><li>Change plan</li></ul><p>Connect the payment instrument layer to seller operations.</p></div></div>'+cta("Complete Seller Journey","Keep the exact onboarding, invoice and Step 3 intelligence sequence available for inspection.","celebrate();go(\'done\')");return}
if(s==="done"){v.innerHTML=topHero("Result","Mabrook — Seller Journey Complete","Start Onboarding → K-Assistant → K-Tag → Sample Invoice → Reward Rules → Value Vault branch → Generate/Share Invoice → A-Assist Dashboard → Focus / Intelligence.",img.store)+section("Flow coverage","COMPLETE","The visual design has changed; the supplied process order and branches have not.")+'<div class="grid3"><div class="glass section"><strong>K-Assistant</strong><div class="sub">Floating companion after setup.</div></div><div class="glass section"><strong>Invoice</strong><div class="sub">Generate + Print / K-Assist share.</div></div><div class="glass section"><strong>Dashboard</strong><div class="sub">Focus + Intelligence.</div></div></div>'+cta("Replay Exact Seller Flow","Restart the same approved sequence without changing the flow structure.","S.history=[];go(\'onboard\')");return}
}
render();
</script>
</body></html>
