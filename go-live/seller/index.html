<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KANZPAY K-Assistant Seller</title><style>
:root{--bg:#070908;--panel:#141713;--gold:#d8b34c;--gold2:#f2d98a;--text:#f4f0e5;--muted:#a7a59b;--line:#d8b34c33}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 70% 0,#292419,#070908 48%);color:var(--text);font:14px Inter,system-ui,sans-serif}.shell{padding:22px;max-width:1300px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;letter-spacing:.18em}.brand b{color:var(--gold2)}.sys{font-size:12px;color:var(--muted)}.hero{padding:28px 0}.k{font-size:11px;color:var(--gold2);letter-spacing:.16em;text-transform:uppercase}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:16px}.card{background:rgba(19,22,19,.8);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 18px 50px #0006;backdrop-filter:blur(14px)}.bento{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.metric{min-height:130px}.metric .n{font-size:30px;font-weight:800;color:var(--gold2);margin-top:14px}.list{display:grid;gap:9px}.item{padding:12px;border:1px solid #ffffff10;border-radius:13px;background:#0d100e}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.btn{border:1px solid var(--line);background:#10130f;color:var(--text);padding:10px 14px;border-radius:12px}.primary{background:linear-gradient(120deg,#9c7621,#ead27b,#a47b23);color:#12110d;border:0;font-weight:800}.nav{display:flex;gap:8px;overflow:auto;margin:16px 0}.nav button{white-space:nowrap}.modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:20px;z-index:5}.modal>div{max-width:700px;width:100%}.hidden{display:none}.pill{font-size:11px;border-radius:999px;padding:5px 8px;background:#d8b34c14;color:var(--gold2)}h1{font-size:38px;margin:8px 0}h2{margin:6px 0 16px}.gold{color:var(--gold2)}@media(max-width:900px){.grid{grid-template-columns:1fr}.bento{grid-template-columns:1fr 1fr}}@media(max-width:560px){.bento{grid-template-columns:1fr}}
</style></head><body><div class="shell"><header class="top"><div class="brand">KANZ<span>PAY</span> <b>K-ASSISTANT</b></div><div class="sys" id="sys">Detecting seller system…</div></header><div class="nav"><button class="btn primary" onclick="view('dashboard')">Dashboard</button><button class="btn" onclick="view('orders')">Orders</button><button class="btn" onclick="view('catalogue')">Catalogue</button><button class="btn" onclick="view('profile')">Profile Settings</button></div><main id="app"></main></div><div id="modal" class="modal hidden"><div class="card" id="box"></div></div><script>
const state={invoice:'In-Process',catalogue:124,orders:18,low:7,focus:42};const $=s=>document.querySelector(s);
function modal(x){$('#box').innerHTML=x;$('#modal').classList.remove('hidden')}function close(){ $('#modal').classList.add('hidden')}
async function system(){if(window.kassist){const s=await window.kassist.system();$('#sys').textContent='System: '+s.platform+' · '+s.arch+' · '+s.version; }else $('#sys').textContent='Browser review · system detection enabled in desktop build'}
function view(v){if(v==='dashboard')dashboard();if(v==='orders')orders();if(v==='catalogue')catalogue();if(v==='profile')profile()}
function dashboard(){$('#app').innerHTML=`<section class="hero"><span class="k">STEP 4 · DASHBOARD TRIGGER FROM K-ASSIST LOGO</span><h1>Seller Cockpit</h1><p style="color:var(--muted)">All-store view. The floating K-Assistant logo remains available while you work.</p></section><section class="bento"><div class="card metric"><span class="k">Orders · Focus</span><div class="n">${state.orders}</div><p class="muted">Pending + in-process + history</p></div><div class="card metric"><span class="k">Invoice Status</span><div class="n gold">${state.invoice}</div><p class="muted">Triggered from K-Assist</p></div><div class="card metric"><span class="k">Catalogue</span><div class="n">${state.catalogue}</div><p class="muted">Live SKU count</p></div><div class="card metric"><span class="k">Low Stock</span><div class="n">${state.low}</div><p class="muted">SKU list +/-</p></div><div class="card metric"><span class="k">Repeat Customers</span><div class="n">${state.focus}%</div><p class="muted">Customer trend</p></div><div class="card metric"><span class="k">Intelligence</span><div class="n">AI</div><p class="muted">Value · volume · customer trends</p></div></section><div class="actions" style="margin-top:16px"><button class="btn primary" onclick="invoice()">Open invoice flow</button><button class="btn" onclick="identify()">Identify system</button></div>`}
function invoice(){modal(`<span class="k">K-ASSIST INVOICE</span><h2>View status of Invoice trigger from K-Assist Logo</h2><div class="list"><div class="item"><div class="row"><b>Paid</b><span class="pill">Completed</span></div></div><div class="item"><div class="row"><b>Rejected</b><span class="pill">Ask buyer · reason</span></div></div><div class="item"><div class="row"><b>In-Process</b><span class="pill">Check if buyer needs help</span></div></div><div class="item"><div class="row"><b>Pending</b><span class="pill">Awaiting action</span></div></div></div><div style="margin-top:14px"><button class="btn primary" onclick="close()">Done</button></div>`)}
function orders(){$('#app').innerHTML=`<div class="card"><span class="k">ORDERS</span><h2>Orders</h2><div class="list"><div class="item"><b>Pending orders</b><span class="pill">6</span></div><div class="item"><b>In-Process orders</b><span class="pill">4</span></div><div class="item"><b>Order History</b><span class="pill">8</span></div><div class="item"><b>Tickets</b><span class="muted">Complaints · Queries · Ratings</span></div><div class="item"><b>Rewards</b><span class="muted">Bill Value-Points ratio · Points-Discount ratio · Gold=% of Bill Value</span></div></div></div>`}
function catalogue(){$('#app').innerHTML=`<div class="card"><span class="k">CATALOGUE</span><h2>Catalogue & Inventory</h2><div class="list"><div class="item"><b>Editable Menu page</b></div><div class="item"><b>Competitive price SKU</b></div><div class="item"><b>Menu Templates</b></div><div class="item"><b>Low stock SKU list +/-</b></div><div class="item"><b>High stock SKU list +/-</b></div><div class="item"><b>Finance</b><span class="muted">Payables · Receivables · P&L · Balance sheet</span></div><div class="item"><b>Payment Instruments</b><span class="muted">Cards · Account to Account · Settlement · Transaction cycle · Change plan</span></div></div></div>`}
function profile(){$('#app').innerHTML=`<div class="card"><span class="k">PROFILE SETTINGS</span><h2>K-Assistant Seller Setup</h2><div class="list"><div class="item"><b>Business type</b><span class="muted">Store / Restaurant / Service</span></div><div class="item"><b>Location</b><span class="muted">Latitude / Longitude</span></div><div class="item"><b>Address</b><span class="muted">Seller location and contact</span></div><div class="item"><b>Logo</b><span class="muted">KanzPay seller identity</span></div><div class="item"><b>Emirates ID + Commercial Licence</b><span class="muted">Front / back + live camera verification flow</span></div></div><div style="margin-top:14px"><button class="btn primary" onclick="modal('<h2>Setup saved</h2><p class=muted>Seller profile changes are staged for the connected backend.</p><button class=btn onclick=close()>Done</button>')">Save settings</button></div></div>`}
function identify(){toast('Seller system identified and K-Assist floating logo is active')}function toast(t){modal('<h2 class=gold>'+t+'</h2><button class=btn primary onclick=close()>OK</button>')}
dashboard();system();
</script></body></html>
